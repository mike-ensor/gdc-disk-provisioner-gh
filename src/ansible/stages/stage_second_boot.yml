- name: "GDC-STATE | Wait for Gitea and Nexus ports to become active"
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: "{{ item }}"
    state: started
    timeout: 180
  loop:
    - 3000
    - 8081

- name: "GDC-STATE | Verify that Gitea and Nexus service hubs are responsive"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ item }}"
    method: GET
    status_code: [200, 302, 401]
  loop:
    - 3000
    - 8081
  register: second_boot_hubs_check

- name: "GDC-STATE | Verify LUKS auto-decrypt unsealed cleanly"
  ansible.builtin.stat:
    path: /dev/mapper/crypt-system
  register: luks_system_mapped
  failed_when: not luks_system_mapped.stat.exists

- name: "GDC-NETWORK | Network Sanity Check (Ping Gateway with DHCP wait)"
  ansible.builtin.shell: |
    # 1. Check if the primary interface has an IP yet.
    if ! ip -4 addr show dev "{{ gdc_primary_interface }}" | grep -q "inet "; then
      echo "Waiting for DHCP lease on {{ gdc_primary_interface }}..."
      exit 1
    fi

    # 2. Extract the gateway specific to the primary interface.
    GW_IP=$(ip route show table all | grep "default.*dev {{ gdc_primary_interface }}" | awk '{print $3}' | head -n 1)
    if [ -z "$GW_IP" ]; then
      echo "Waiting for default route on {{ gdc_primary_interface }}..."
      exit 1
    fi

    # 3. We have an IP and a Gateway. Attempt the ping.
    ping -c 1 -W 2 -I "{{ gdc_primary_interface }}" "$GW_IP"
  register: gateway_ping
  changed_when: false
  ignore_errors: true
  until: gateway_ping.rc == 0
  retries: 15
  delay: 5

- name: "GDC-NETWORK | Halt if Network Sanity Check Fails"
  ansible.builtin.fail:
    msg: "Network Sanity Check failed. Cannot ping gateway for interface {{ gdc_primary_interface }}"
  when: gateway_ping.rc != 0

- name: "GDC-EVIDENCE | Set Second Boot Evidence"
  ansible.builtin.set_fact:
    second_boot_evidence:
      network_sanity: "Network Sanity Check [{{ gdc_primary_interface }}] = {{ 'True' if gateway_ping.rc is defined and gateway_ping.rc == 0 else 'False' }}"

- name: "GDC-STATE | Write SecondBoot completion state"
  ansible.builtin.copy:
    dest: /var/gdc-install/state/second-boot.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "stage": "second-boot",
        "status": "completed",
        "timestamp": "{{ ansible_date_time.iso8601 }}",
        "evidence": {{ second_boot_evidence | default({}) | to_json }}
      }

# Update the fact in-memory so subsequent stage execution is allowed
- name: "GDC-STATE | Update SecondBoot fact in-memory"
  ansible.builtin.set_fact:
    second_boot_state: { "status": "completed" }
