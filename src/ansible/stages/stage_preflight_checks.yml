---
# ==============================================================================
# GDC Node Pre-Flight Validations
# ==============================================================================
# Stage: GDC-PREFLIGHT
# Fails fast if necessary dependencies, binaries, block devices, or network 
# interfaces are missing before any system mutations occur.
# ==============================================================================

- name: "GDC-PREFLIGHT | Initialize Pre-flight tracking variables"
  ansible.builtin.set_fact:
    preflight_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
    preflight_results: []
    preflight_overall_status: "PASS"
    gsm_secret_decoded: {}
    gsm_secret_parse_failed: false

# ------------------------------------------------------------------------------
# 1. CORE CLI BINARIES CHECKS
# ------------------------------------------------------------------------------
- name: "GDC-PREFLIGHT | Verify Required System Binaries"
  block:
    - name: "GDC-PREFLIGHT | Assert Core CLI binaries exist in PATH"
      ansible.builtin.command: "which {{ item }}"
      register: binary_check
      changed_when: false
      failed_when: false
      loop:
        - git
        - ansible
        - parted
        - wipefs
        - sgdisk
        - cryptsetup
        - tpm2_pcrread
        - curl
        - jq
        - systemctl

    - name: "GDC-PREFLIGHT | Register Binary Check Results"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{
            preflight_results + [{
              "test_name": "binary_check_" + item.item,
              "category": "binary",
              "status": "PASS" if item.rc == 0 else "FAIL",
              "severity": "FATAL",
              "notes": "Binary " + item.item + (" found at " + item.stdout if item.rc == 0 else " missing from PATH"),
              "remediation_hint": "Ensure package providing " + item.item + " is installed in the baseline ISO.",
              "timestamp": now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              "duration_ms": 10
            }]
          }}
      loop: "{{ binary_check.results }}"

# ------------------------------------------------------------------------------
# 2. HARDWARE & DEVICE INTERFACES
# ------------------------------------------------------------------------------
- name: "GDC-PREFLIGHT | Verify Hardware Capabilities (TPM & Disks)"
  block:
    - name: "GDC-PREFLIGHT | Check for TPM 2.0 device interface"
      ansible.builtin.stat:
        path: /dev/tpmrm0
      register: tpm_stat

    - name: "GDC-PREFLIGHT | Register TPM Check Result"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{
            preflight_results + [{
              "test_name": "hardware_tpm2_interface",
              "category": "hardware",
              "status": "PASS" if (tpm_stat.stat.exists and tpm_stat.stat.ischr) else "FAIL",
              "severity": "FATAL",
              "notes": "TPM 2.0 interface /dev/tpmrm0 " + ("found and is a character device" if (tpm_stat.stat.exists and tpm_stat.stat.ischr) else "missing or invalid"),
              "remediation_hint": "Check BIOS/UEFI settings for TPM 2.0 availability and ensure kernel TPM drivers are loaded.",
              "timestamp": now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              "duration_ms": 10
            }]
          }}

    - name: "GDC-PREFLIGHT | Gather device facts"
      ansible.builtin.setup:
        filter: ansible_devices

    - name: "GDC-PREFLIGHT | Check for Block Storage Devices"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{
            preflight_results + [{
              "test_name": "hardware_block_storage",
              "category": "storage",
              "status": "PASS" if (ansible_facts['devices'] | length > 0) else "FAIL",
              "severity": "FATAL",
              "notes": "Discovered " + (ansible_facts['devices'] | length | string) + " block storage devices.",
              "remediation_hint": "Ensure NVMe/SATA/SAS controllers are active and storage drives are physically connected.",
              "timestamp": now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              "duration_ms": 10
            }]
          }}

# ------------------------------------------------------------------------------
# 3. NETWORK & ENDPOINTS HOOKS
# ------------------------------------------------------------------------------
- name: "GDC-PREFLIGHT | Verify Network & Endpoint Dependencies"
  block:
    - name: "GDC-PREFLIGHT | Execute Google API and Registry endpoint readiness audit"
      ansible.builtin.command: >-
        python3 {{ playbook_dir }}/scripts/check_endpoints.py
        --config {{ playbook_dir }}/vars/endpoints.yml
        --stage "{{ current_stage | default(gdc_active_stage | default('preflight')) }}"
        --companion-url "{{ gdc_companion_reports_url | default('') }}"
        --step-ca-url "{{ gdc_step_ca_url | default('') }}"
      register: endpoint_check_raw
      changed_when: false
      failed_when: false

    - name: "GDC-PREFLIGHT | Register Endpoint Connectivity Results"
      ansible.builtin.set_fact:
        preflight_results: "{{ preflight_results + (endpoint_check_raw.stdout | from_json) }}"
      when: 
        - endpoint_check_raw.rc == 0
        - endpoint_check_raw.stdout is defined
        - endpoint_check_raw.stdout | length > 2

    - name: "GDC-PREFLIGHT | Detect Platform DNS Resolution Failures & Recommend Standalone Fallback"
      ansible.builtin.set_fact:
        dns_fallback_active: true
        dns_failed_domains: >-
          {{
            (endpoint_check_raw.stdout | from_json)
            | selectattr('meta.fallback_recommended', 'defined')
            | selectattr('meta.fallback_recommended', 'equalto', true)
            | map(attribute='meta.domain')
            | list
          }}
      when:
        - endpoint_check_raw.rc == 0
        - endpoint_check_raw.stdout is defined
        - ((endpoint_check_raw.stdout | from_json) | selectattr('meta.fallback_recommended', 'defined') | selectattr('meta.fallback_recommended', 'equalto', true) | list | length > 0)

# ------------------------------------------------------------------------------
# 3.5. PRIMARY ROOT REPO GSM SECRET VALIDATION
# ------------------------------------------------------------------------------
- name: "GDC-PREFLIGHT | Check if manual facts exist to load machine_config if undefined"
  block:
    - name: "GDC-PREFLIGHT | Check /var/gdc-install/state/gdc-fact-manual.json"
      ansible.builtin.stat:
        path: /var/gdc-install/state/gdc-fact-manual.json
      register: _preflight_manual_fact_stat

    - name: "GDC-PREFLIGHT | Slurp /var/gdc-install/state/gdc-fact-manual.json"
      ansible.builtin.slurp:
        src: /var/gdc-install/state/gdc-fact-manual.json
      register: _preflight_slurped_manual_fact
      when: _preflight_manual_fact_stat.stat.exists

    - name: "GDC-PREFLIGHT | Set machine_config from manual facts"
      ansible.builtin.set_fact:
        machine_config: "{{ _preflight_slurped_manual_fact.content | b64decode | from_json }}"
      when:
        - _preflight_manual_fact_stat.stat.exists
        - _preflight_slurped_manual_fact.content is defined
  when: machine_config is not defined

- name: "GDC-PREFLIGHT | Verify Primary Root Repo GSM Secret Preflight"
  block:
    - name: "GDC-PREFLIGHT | Resolve primary_root_repo configuration via lookup"
      ansible.builtin.set_fact:
        _preflight_repo: "{{ lookup('gdc_config_sync', machine_config | default({})) }}"

    - name: "GDC-PREFLIGHT | Extract primary_root_repo target secret and repo type"
      ansible.builtin.set_fact:
        target_repo_type: "{{ _preflight_repo.repo_type }}"
        target_gsm_secret_name: "{{ _preflight_repo.gsm_secret_name }}"
        target_gsm_location: "{{ _preflight_repo.gsm_location | default('global') }}"

    - name: "GDC-PREFLIGHT | Check gcloud CLI availability"
      ansible.builtin.command: which gcloud
      register: preflight_gcloud_check
      changed_when: false
      failed_when: false

    - name: "GDC-PREFLIGHT | Register Skipped Result when GSM Secret Not Required"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{
            preflight_results + [{
              "test_name": "gsm_secret_primary_root_repo",
              "category": "security",
              "status": "PASS",
              "severity": "FATAL",
              "notes": "No GSM secret required or configured for primary_root_repo (skipped/not required).",
              "remediation_hint": "None required.",
              "timestamp": now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              "duration_ms": 0
            }]
          }}
      when: target_gsm_secret_name is not defined or (target_gsm_secret_name | trim | length == 0)

    - name: "GDC-PREFLIGHT | Validate GSM Secret via gcloud"
      block:
        - name: "GDC-PREFLIGHT | Initialize GSM secret variables"
          ansible.builtin.set_fact:
            gsm_secret_decoded: {}
            gsm_secret_parse_failed: false
          no_log: true

        - name: "GDC-PREFLIGHT | Access GSM Secret payload via gcloud"
          ansible.builtin.command: >-
            gcloud secrets versions access latest
            --secret={{ target_gsm_secret_name }}
            --project={{ (machine_config.gcp_info.project_id) if (machine_config.gcp_info is defined and machine_config.gcp_info.project_id is defined) else (gcp_project_id | default('')) }}
            {% if target_gsm_location is defined and target_gsm_location | trim | length > 0 and target_gsm_location != 'global' %}
            --location={{ target_gsm_location }}
            {% endif %}
          register: gsm_access_res
          changed_when: false
          failed_when: false
          no_log: true

        - name: "GDC-PREFLIGHT | Fallback: Access GSM Secret payload as global resource if regional call failed"
          ansible.builtin.command: >-
            gcloud secrets versions access latest
            --secret={{ target_gsm_secret_name }}
            --project={{ (machine_config.gcp_info.project_id) if (machine_config.gcp_info is defined and machine_config.gcp_info.project_id is defined) else (gcp_project_id | default('')) }}
          register: gsm_access_res_fallback
          when:
            - gsm_access_res.rc != 0
            - target_gsm_location is defined
            - target_gsm_location | trim | length > 0
            - target_gsm_location != 'global'
          changed_when: false
          failed_when: false
          no_log: true

        - name: "GDC-PREFLIGHT | Adopt fallback GSM payload if successful"
          ansible.builtin.set_fact:
            gsm_access_res: "{{ gsm_access_res_fallback }}"
          when:
            - gsm_access_res_fallback is defined
            - gsm_access_res_fallback.rc is defined
            - gsm_access_res_fallback.rc == 0

        - name: "GDC-PREFLIGHT | Parse and validate secret payload"
          block:
            - name: "GDC-PREFLIGHT | Decode secret JSON payload"
              ansible.builtin.set_fact:
                gsm_secret_decoded: "{{ gsm_access_res.stdout | from_json }}"
                gsm_secret_parse_failed: false
              no_log: true
              when:
                - gsm_access_res is defined
                - gsm_access_res.rc is defined
                - gsm_access_res.rc == 0
                - gsm_access_res.stdout is defined
          rescue:
            - name: "GDC-PREFLIGHT | Mark secret JSON decoding failure"
              ansible.builtin.set_fact:
                gsm_secret_decoded: {}
                gsm_secret_parse_failed: true
              no_log: true

        - name: "GDC-PREFLIGHT | Resolve secret payload validity via lookup"
          ansible.builtin.set_fact:
            _secret_val: "{{ lookup('gdc_config_sync', 'secret_payload', (gsm_secret_decoded | default({})), repo_type=target_repo_type) }}"
          no_log: true

        - name: "GDC-PREFLIGHT | Evaluate secret payload validity"
          ansible.builtin.set_fact:
            gsm_secret_is_valid: >-
              {{
                false if (
                  (gsm_access_res is not defined or gsm_access_res.rc is not defined or gsm_access_res.rc != 0)
                  or (gsm_secret_parse_failed | default(true) | bool)
                  or not (_secret_val.valid | default(false) | bool)
                )
                else true
              }}
            gsm_secret_failure_note: >-
              {{
                ("Secret '" + target_gsm_secret_name + "' payload access failed (not found or permission denied in project " + ((machine_config.gcp_info.project_id if (machine_config.gcp_info is defined and machine_config.gcp_info.project_id is defined) else (gcp_project_id | default('UNKNOWN')))) + ")")
                if (gsm_access_res is not defined or gsm_access_res.rc is not defined or gsm_access_res.rc != 0)
                else (
                  ("Secret '" + target_gsm_secret_name + "' payload is not valid JSON")
                  if (gsm_secret_parse_failed | default(true) | bool)
                  else _secret_val.failure_reason
                )
              }}

        - name: "GDC-PREFLIGHT | Register GSM Secret Preflight Result"
          ansible.builtin.set_fact:
            preflight_results: >-
              {{
                preflight_results + [{
                  "test_name": "gsm_secret_primary_root_repo",
                  "category": "security",
                  "status": "PASS" if (gsm_secret_is_valid | bool) else "FAIL",
                  "severity": "FATAL",
                  "notes": ("GSM secret '" + target_gsm_secret_name + "' verified successfully for " + target_repo_type + " repo.") if (gsm_secret_is_valid | bool) else gsm_secret_failure_note,
                  "remediation_hint": "" if (gsm_secret_is_valid | bool) else ("Ensure secret '" + target_gsm_secret_name + "' exists in GSM project '" + ((machine_config.gcp_info.project_id if (machine_config.gcp_info is defined and machine_config.gcp_info.project_id is defined) else (gcp_project_id | default('')))) + "' and contains valid JSON credentials (" + ("token, password, or ssh-privatekey" if target_repo_type == 'git' else "username and password") + ")."),
                  "timestamp": now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
                  "duration_ms": 10
                }]
              }}

        - name: "GDC-PREFLIGHT | Purge GSM secret payload and access result from memory"
          ansible.builtin.set_fact:
            gsm_secret_decoded: {}
            gsm_access_res: {}
          no_log: true
      when:
        - target_secret_name is defined
        - target_secret_name | trim | length > 0
        - preflight_gcloud_check.rc == 0
        - not (machine_config.is_fallback | default(false) | bool)
        - not (offline_mode | default(false) | bool)

    - name: "GDC-PREFLIGHT | Register Skipped Result if gcloud unavailable or offline/mock mode"
      ansible.builtin.set_fact:
        preflight_results: >-
          {{
            preflight_results + [{
              "test_name": "gsm_secret_primary_root_repo",
              "category": "security",
              "status": "PASS",
              "severity": "FATAL",
              "notes": "GSM secret validation skipped (gcloud unavailable or offline/mock mode).",
              "remediation_hint": "None required for offline or mock mode.",
              "timestamp": now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ'),
              "duration_ms": 0
            }]
          }}
      when:
        - target_secret_name is defined
        - target_secret_name | trim | length > 0
        - (preflight_gcloud_check.rc != 0 or (machine_config.is_fallback | default(false) | bool) or (offline_mode | default(false) | bool))

# ------------------------------------------------------------------------------
# 4. AGGREGATE RESULTS & SERIALIZE CONTRACT
# ------------------------------------------------------------------------------
- name: "GDC-PREFLIGHT | Aggregate Overall Status"
  ansible.builtin.set_fact:
    preflight_overall_status: "FAIL"
  loop: "{{ preflight_results }}"
  when: item.status == "FAIL" and item.severity == "FATAL"

- name: "GDC-PREFLIGHT | Serialize Decoupled JSON Contract"
  ansible.builtin.copy:
    dest: "/var/gdc-install/state/preflight-validation-results.json"
    owner: root
    group: root
    mode: '0644'
    content: |
      {% set _end_epoch = now(utc=true).strftime('%s') | int %}
      {% set _duration_ms = (_end_epoch - (preflight_start_epoch | int)) * 1000 %}
      {
        "$schema": "https://gdc.google.com/schemas/preflight-validation-v1.json",
        "test_suite": "gdc-ansible-preflight",
        "current_stage": "{{ current_stage | default(gdc_active_stage | default('preflight')) }}",
        "execution_timestamp": "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}",
        "overall_status": "{{ preflight_overall_status }}",
        "total_duration_ms": {{ [_duration_ms, 0] | max }},
        "results": {{ preflight_results | to_json }}
      }

# ------------------------------------------------------------------------------
# 5. HALT IF FATAL
# ------------------------------------------------------------------------------
- name: "GDC-PREFLIGHT | Halt Provisioning Pipeline if Fatal Validation Checks Failed"
  block:
    - name: "GDC-PREFLIGHT | Trigger gdc-collector to surface failure telemetry"
      ansible.builtin.shell: |
        if [ -x /usr/local/bin/gdc-collector ]; then
          /usr/local/bin/gdc-collector --stage preflight --companion-url="{{ gdc_companion_reports_url | default('') }}"
        fi
      ignore_errors: true
      failed_when: false
      
    - name: "GDC-PREFLIGHT | Execute Ansible Fail-Fast"
      ansible.builtin.fail:
        msg: "GDC Pre-Flight Validation Failed. Crucial dependencies or hardware missing. See /var/gdc-install/state/preflight-validation-results.json for details."
  when: preflight_overall_status == "FAIL"
