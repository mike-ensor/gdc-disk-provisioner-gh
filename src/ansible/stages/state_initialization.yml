- name: "GDC-NETWORK | Determine primary connected interface"
  ansible.builtin.shell: |
    # Loop through physical /sys/class/net/e* interfaces (excluding VLAN sub-interfaces containing '.')
    for iface in $(ls -d /sys/class/net/e* | grep -v '\.' | sort); do
      # Check if the carrier file exists and reads '1' (physically connected)
      if [ -f "$iface/carrier" ] && [ "$(cat $iface/carrier 2>/dev/null)" = "1" ]; then
        basename "$iface"
        exit 0
      fi
    done
    # Fallback to the first physical e* interface if nothing shows carrier
    basename $(ls -d /sys/class/net/e* | grep -v '\.' | head -n 1)
  register: detect_primary_iface
  changed_when: false

- name: "GDC-NETWORK | Set primary interface fact"
  ansible.builtin.set_fact:
    gdc_primary_interface: "{{ detect_primary_iface.stdout }}"

- name: "GDC-STATE | Initialize State Machine directory"
  ansible.builtin.file:
    path: /var/gdc-install/state
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "GDC-TIMING | Check existing provisioning timing state"
  ansible.builtin.stat:
    path: /var/gdc-install/state/provisioning-timing.json
  register: prov_timing_stat

- name: "GDC-TIMING | Load existing provisioning timing state"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/provisioning-timing.json
  register: slurped_prov_timing
  when: prov_timing_stat.stat.exists
  ignore_errors: true
  failed_when: false

- name: "GDC-TIMING | Set provisioning timing facts from existing file"
  ansible.builtin.set_fact:
    provisioning_start_time: "{{ (slurped_prov_timing.content | b64decode | from_json).provisioning_start_time }}"
    provisioning_start_epoch: "{{ (slurped_prov_timing.content | b64decode | from_json).provisioning_start_epoch | int }}"
  when:
    - prov_timing_stat.stat.exists
    - slurped_prov_timing is defined and slurped_prov_timing.content is defined

- name: "GDC-TIMING | Initialize new provisioning timing facts if first run"
  ansible.builtin.set_fact:
    provisioning_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    provisioning_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
  when: not prov_timing_stat.stat.exists

- name: "GDC-TIMING | Persist provisioning timing file"
  ansible.builtin.copy:
    dest: /var/gdc-install/state/provisioning-timing.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "provisioning_start_time": "{{ provisioning_start_time }}",
        "provisioning_start_epoch": {{ provisioning_start_epoch }}
      }
  when: not prov_timing_stat.stat.exists

- name: "GDC-STATE | Check existing state files"
  ansible.builtin.stat:
    path: "/var/gdc-install/state/{{ item }}.json"
  loop:
    - "first-boot"
    - "second-boot"
    - "linux-ready"
    - "cluster-ready"
    - "cluster-turnup"
  register: state_files_stat

- name: "GDC-STATE | Initialize default state facts"
  ansible.builtin.set_fact:
    first_boot_state: { "status": "pending" }
    second_boot_state: { "status": "pending" }
    linux_ready_state: { "status": "pending" }
    cluster_ready_state: { "status": "pending" }
    cluster_turnup_state: { "status": "pending" }

- name: "GDC-STATE | Resolve machine state stop stage"
  ansible.builtin.set_fact:
    stop_stage: "{{ lookup('gdc_stop_stage') }}"

- name: "GDC-STATE | Load FirstBoot State if exists"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/first-boot.json
  register: slurped_first_boot
  when: state_files_stat.results[0].stat.exists
  ignore_errors: true
  failed_when: false

- name: "GDC-STATE | Set FirstBoot State fact"
  ansible.builtin.set_fact:
    first_boot_state: "{{ slurped_first_boot.content | b64decode | from_json }}"
  when:
    - state_files_stat.results[0].stat.exists
    - slurped_first_boot is defined and slurped_first_boot.content is defined

- name: "GDC-STATE | Load SecondBoot State if exists"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/second-boot.json
  register: slurped_second_boot
  when: state_files_stat.results[1].stat.exists
  ignore_errors: true
  failed_when: false

- name: "GDC-STATE | Set SecondBoot State fact"
  ansible.builtin.set_fact:
    second_boot_state: "{{ slurped_second_boot.content | b64decode | from_json }}"
  when:
    - state_files_stat.results[1].stat.exists
    - slurped_second_boot is defined and slurped_second_boot.content is defined

- name: "GDC-STATE | Load LinuxReady State if exists"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/linux-ready.json
  register: slurped_linux_ready
  when: state_files_stat.results[2].stat.exists
  ignore_errors: true
  failed_when: false

- name: "GDC-STATE | Set LinuxReady State fact"
  ansible.builtin.set_fact:
    linux_ready_state: "{{ slurped_linux_ready.content | b64decode | from_json }}"
  when:
    - state_files_stat.results[2].stat.exists
    - slurped_linux_ready is defined and slurped_linux_ready.content is defined

- name: "GDC-STATE | Load ClusterReady State if exists"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/cluster-ready.json
  register: slurped_cluster_ready
  when: state_files_stat.results[3].stat.exists
  ignore_errors: true
  failed_when: false

- name: "GDC-STATE | Set ClusterReady State fact"
  ansible.builtin.set_fact:
    cluster_ready_state: "{{ slurped_cluster_ready.content | b64decode | from_json }}"
  when:
    - state_files_stat.results[3].stat.exists
    - slurped_cluster_ready is defined and slurped_cluster_ready.content is defined

- name: "GDC-STATE | Load ClusterTurnup State if exists"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/cluster-turnup.json
  register: slurped_cluster_turnup
  when: state_files_stat.results[4].stat.exists
  ignore_errors: true
  failed_when: false

- name: "GDC-STATE | Set ClusterTurnup State fact"
  ansible.builtin.set_fact:
    cluster_turnup_state: "{{ slurped_cluster_turnup.content | b64decode | from_json }}"
  when:
    - state_files_stat.results[4].stat.exists
    - slurped_cluster_turnup is defined and slurped_cluster_turnup.content is defined

- name: "GDC-STATE | Initialize active lifecycle stage"
  ansible.builtin.set_fact:
    gdc_active_stage: "{{ lookup('gdc_state') }}"

# ------------------------------------------------------------------------------
# 6. PERSISTENT MACHINE CONFIG REHYDRATION
# ------------------------------------------------------------------------------
# Ensures machine_config is restored in memory for downstream stages
# (e.g. ClusterTurnup, PostCluster) when prior stages completed previously.
- name: "GDC-STATE | Rehydrate machine_config if undefined"
  when: machine_config is not defined or machine_config == {}
  block:
    - name: "GDC-STATE | Check candidate machine_config sources on disk"
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/gdc-install/state/gdc-fact-manual.json
        - /var/gdc-install/state/gdc-machine-facts-manual.json
        - /etc/ansible/facts.d/gdc.fact
        - /etc/gdc/machine-info-mock.json
        - /etc/gdc/fallback-config.json
      register: _candidate_config_stats

    - name: "GDC-STATE | Find first existing candidate config"
      ansible.builtin.set_fact:
        _existing_config_file: "{{ (_candidate_config_stats.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | list | first) | default('') }}"

    - name: "GDC-STATE | Slurp machine_config from disk"
      ansible.builtin.slurp:
        src: "{{ _existing_config_file }}"
      register: _slurped_existing_config
      when: _existing_config_file | length > 0
      ignore_errors: true
      failed_when: false

    - name: "GDC-STATE | Set machine_config fact from disk"
      ansible.builtin.set_fact:
        machine_config: "{{ _slurped_existing_config.content | b64decode | from_json }}"
      when:
        - _slurped_existing_config is defined
        - _slurped_existing_config.content is defined

    - name: "GDC-STATE | Set machine_config from ansible_local if still undefined"
      ansible.builtin.set_fact:
        machine_config: "{{ ansible_local.gdc }}"
      when:
        - (machine_config is not defined or machine_config == {})
        - ansible_local is defined
        - ansible_local.gdc is defined
