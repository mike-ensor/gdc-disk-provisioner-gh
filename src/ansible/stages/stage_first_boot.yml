- name: "GDC-TIMING | Ensure FirstBoot start time is set"
  ansible.builtin.set_fact:
    first_boot_start_time: "{{ first_boot_start_time | default(now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')) }}"
    first_boot_start_epoch: "{{ first_boot_start_epoch | default(now(utc=true).strftime('%s') | int) }}"

- name: Run local_dns role
  ansible.builtin.include_role:
    name: local_dns

- name: Run service_hubs role
  ansible.builtin.include_role:
    name: service_hubs

- name: "GDC-TIMING | Calculate FirstBoot timing facts"
  ansible.builtin.set_fact:
    first_boot_end_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
    first_boot_duration_seconds: "{{ [(now(utc=true).strftime('%s') | int) - (first_boot_start_epoch | int), 0] | max }}"

- name: "GDC-EVIDENCE | Structure FirstBoot Evidence Facts"
  ansible.builtin.set_fact:
    first_boot_evidence:
      timing:
        start_time: "{{ first_boot_start_time }}"
        end_time: "{{ first_boot_end_time }}"
        duration_seconds: "{{ first_boot_duration_seconds | int }}"
        overall_provisioning_start_time: "{{ provisioning_start_time | default(first_boot_start_time) }}"

- name: "GDC-STATE | Write FirstBoot completion state"
  ansible.builtin.copy:
    dest: /var/gdc-install/state/first-boot.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "stage": "first-boot",
        "status": "completed",
        "timestamp": "{{ first_boot_end_time }}",
        "evidence": {{ first_boot_evidence | to_json }}
      }

- name: "GDC-STATE | Update FirstBoot fact in-memory"
  ansible.builtin.set_fact:
    first_boot_state: { "status": "completed" }

- name: "GDC-STATE | Trigger Post-Stage Telemetry"
  ansible.builtin.shell: |
    if [ -x /usr/local/bin/gdc-collector ]; then
      /usr/local/bin/gdc-collector --stage first-boot --companion-url="{{ gdc_companion_reports_url | default('') }}"
    fi
  changed_when: false
  failed_when: false

- name: "GDC-STATE | Reboot to transition to SecondBoot verification stage"
  ansible.builtin.shell: |
    sleep 15 && shutdown -r now "GDC FirstBoot completed. Rebooting to verify system auto-unsealing and stability."
  async: 60
  poll: 0

- name: "GDC-STATE | Force play end to await scheduled reboot"
  ansible.builtin.meta: end_play
