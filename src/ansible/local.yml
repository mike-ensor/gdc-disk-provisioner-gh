---
# ==============================================================================
# GDC Node First-Boot Self-Test & Ready-Linux Provisioning Playbook
# ==============================================================================
# Executes locally on first boot to:
#   1. Validate Service Hub readiness (Gitea Port 3000, Nexus Port 8081).
#   2. Query and log physical disk partition structures.
#   3. Perform offline system-wide safe package upgrades.
#   4. Install our variable-driven list of core system packages (offline).
#   5. Persistently enable Gitea and Nexus daemons on the host.
#   6. Configure the persistent `ansible-pull` cron executor with GPG signed-commit enforcement.
# ==============================================================================

- name: GDC Ready-Linux Post-Install & Provisioning Suite
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Target package list and specific versions to install during post-install
    # (Matches our variables inside build.env)
    post_install_packages:
      - "git"
    
    # Toggle to enforce GPG signed commits inside the local ansible-pull runner
    # Set to 'false' during initial development; set to 'true' for production.
    enforce_signed_commits: false

  tasks:
    - name: "GDC-LOG-CON | Log Ansible startup to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "--- GDC ANSIBLE PROVISIONER STARTING ---" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true

    # --------------------------------------------------------------------------
    # Stage 1: Local Service Readiness Checks (Hubs)
    # --------------------------------------------------------------------------
    - name: "GDC-VERIFY-001 | Check Gitea Service Hub Readiness (Port 3000)"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        state: started
        timeout: 300
        msg: "Timeout waiting for Gitea to listen on local port 3000. Check target logs."

    - name: "GDC-VERIFY-002 | Check Nexus Service Hub Readiness (Port 8081)"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8081
        state: started
        timeout: 300
        msg: "Timeout waiting for Nexus to listen on local port 8081. Check target logs."

    - name: "GDC-VERIFY-003 | Confirm Service Endpoints are Accessible"
      ansible.builtin.debug:
        msg: "Success: Local Service Boundary Hubs (Gitea on Port 3000 and Nexus on Port 8081) are fully accessible."

    - name: "GDC-LOG-CON | Log services ready to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "--- GDC LOCAL SERVICE HUBS OPERATIONAL & READY ---" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true

    # --------------------------------------------------------------------------
    # Stage 2: Retrieve Disk and Block Partition Layout
    # --------------------------------------------------------------------------
    - name: "GDC-VERIFY-004 | Query System Block Devices (lsblk)"
      ansible.builtin.command: lsblk -o NAME,FSTYPE,SIZE,MOUNTPOINTS
      register: lsblk_result
      changed_when: false

    - name: "GDC-VERIFY-005 | Print Partition Layout"
      ansible.builtin.debug:
        var: lsblk_result.stdout_lines

    # --------------------------------------------------------------------------
    # Stage 3: Test Outbound Network (With air-gap fallback)
    # --------------------------------------------------------------------------
    - name: "GDC-VERIFY-006 | Ping External DNS Server (8.8.8.8)"
      ansible.builtin.command: ping -c 3 8.8.8.8
      register: ping_result
      changed_when: false
      ignore_errors: true

    - name: "GDC-VERIFY-007 | Report Outbound Network State"
      ansible.builtin.debug:
        msg: >
          {% if ping_result.rc == 0 %}
          Outbound Internet Network Ping succeeded! Server has route to the public internet.
          {% else %}
          Outbound Internet Network Ping failed or is blocked. Running in offline/air-gapped mode.
          {% endif %}

    # --------------------------------------------------------------------------
    # Stage 4: Persistent Service Configurations
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION-101 | Ensure Gitea and Nexus are persistently Enabled & Running"
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - gitea
        - nexus

    # --------------------------------------------------------------------------
    # Stage 4b: Hermetic Offline Package Repository Setup
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION | Ensure SSH privilege separation directory exists"
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "GDC-PROVISION | Ensure SSH service is restarted"
      ansible.builtin.systemd:
        name: ssh
        state: restarted
      ignore_errors: true

    - name: "GDC-OFFLINE-APT | Ensure GDC APT keyrings directory exists"
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "GDC-OFFLINE-APT | Register GDC Nexus trusted keyring"
      ansible.builtin.copy:
        src: /etc/ssl/certs/gdc-release.gpg
        dest: /etc/apt/keyrings/gdc-nexus.gpg
        owner: root
        group: root
        mode: '0644'
        remote_src: true
      ignore_errors: true

    - name: "GDC-OFFLINE-APT | Write DEB822 local loopback Nexus sources"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/gdc-nexus.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          # Local GDC Hosted (Sideloaded Update) Repository
          Enabled: yes
          Types: deb
          URIs: http://127.0.0.1:8081/repository/gdc-apt-hosted/
          Suites: noble
          Components: main restricted universe multiverse
          Signed-By: /etc/apt/keyrings/gdc-nexus.gpg

          # Local GDC Proxy (Upstream Cache) Repository
          Enabled: yes
          Types: deb
          URIs: http://127.0.0.1:8081/repository/gdc-apt-proxy/
          Suites: noble
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

    - name: "GDC-OFFLINE-APT | Enforce Hosted APT Priority Pinning"
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/gdc-nexus-pin
        owner: root
        group: root
        mode: '0644'
        content: |
          Package: *
          Pin: release o=gdc-apt-hosted
          Pin-Priority: 1001

    - name: "GDC-OFFLINE-APT | Check for active public Ubuntu sources"
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/ubuntu.sources
      register: public_sources_stat

    - name: "GDC-OFFLINE-APT | Deactivate public Ubuntu DEB822 sources"
      ansible.builtin.command: mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.bak
      when: public_sources_stat.stat.exists
      changed_when: true

    - name: "GDC-OFFLINE-APT | Check for standard sources.list"
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: standard_sources_stat

    - name: "GDC-OFFLINE-APT | Deactivate standard sources.list"
      ansible.builtin.command: mv /etc/apt/sources.list /etc/apt/sources.list.bak
      when: standard_sources_stat.stat.exists
      changed_when: true

    # --------------------------------------------------------------------------
    # Stage 5: System Upgrades & Variable-Driven Package Installations
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION-102 | Perform Complete Offline System Package Upgrade"
      ansible.builtin.apt:
        upgrade: safe
        update_cache: false
      register: apt_upgrade_result
      ignore_errors: true
      when: trigger_system_upgrade | default(false)

    - name: "GDC-PROVISION-103 | Log System Package Upgrade Results"
      ansible.builtin.debug:
        msg: "Safe system-wide offline package upgrade executed successfully."
      when:
        - apt_upgrade_result is succeeded
        - trigger_system_upgrade | default(false)

    - name: "GDC-LOG-CON | Log packages wait to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "--- GDC SYSTEM PACKAGES INSTALLATION STARTED ---" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true

    - name: "GDC-PROVISION-104a | Check if packages are already installed"
      ansible.builtin.command: dpkg -s {{ item }}
      loop: "{{ post_install_packages }}"
      register: package_check
      ignore_errors: true
      changed_when: false

    - name: "GDC-PROVISION-104 | Install GDC Configured Post-Install Packages"
      ansible.builtin.apt:
        name: "{{ item.item }}"
        state: present
        update_cache: false
      loop: "{{ package_check.results }}"
      when: item.rc != 0
      register: apt_install_result

    # --------------------------------------------------------------------------
    # Stage 6: Configure Persistent GPG Signed-Commits for Ansible-Pull
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION-105 | Create systemd environment file for gdc-provisioner"
      ansible.builtin.copy:
        dest: /etc/default/gdc-provision
        owner: root
        group: root
        mode: '0644'
        content: |
          # gdc-provisioner execution environment configurations
          # Enforce signed commits toggle mapping
          ANSIBLE_PULL_FLAGS="{% if enforce_signed_commits %}--verify-commit{% else %}{% endif %}"
      register: env_config_result

    - name: "GDC-PROVISION-106 | Setup Local Gitea GPG Verification Keys"
      ansible.builtin.copy:
        src: /etc/ssl/certs/gdc-release.gpg
        dest: /etc/gpg/gdc-release.gpg
        owner: root
        group: root
        mode: '0644'
        remote_src: true
      when: enforce_signed_commits
      ignore_errors: true

    - name: "GDC-PROVISION-107 | Ensure legacy cron job is absent"
      ansible.builtin.cron:
        name: "Run GDC local config pull-sync (30 min cycles)"
        state: absent

    - name: "GDC-PROVISION-107b | Ensure daily systemd timer is enabled and running"
      ansible.builtin.systemd:
        name: gdc-provision.timer
        enabled: true
        state: started

    # --------------------------------------------------------------------------
    # Stage 7: Hardware Security (TPM 2.0 LUKS Sealing & Passcode Purging)
    # --------------------------------------------------------------------------
    - name: "GDC-TPM-SEAL | Verify physical or emulated TPM 2.0 availability"
      ansible.builtin.stat:
        path: /dev/tpmrm0
      register: tpm_device_stat

    - name: "GDC-TPM-SEAL | Retrieve GDC LUKS system device partitions"
      ansible.builtin.shell: blkid -t TYPE=crypto_LUKS -o device
      register: luks_partition_devices
      changed_when: false
      failed_when: luks_partition_devices.stdout == ""
      when: tpm_device_stat.stat.exists

    - name: "GDC-TPM-SEAL | Check if system is booted in UEFI mode"
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: efi_sys_stat

    - name: "GDC-TPM-SEAL | Seal LUKS Master Key to TPM 2.0 PCR registers (0+2+7) in UEFI mode"
      ansible.builtin.shell: |
        systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+2+7 {{ item }}
      environment:
        PASSWORD: "temporary_bootstrap_key_to_be_enrolled_to_tpm"
        TCTI: "device:/dev/tpmrm0"
      loop: "{{ luks_partition_devices.stdout_lines }}"
      when:
        - tpm_device_stat.stat.exists
        - efi_sys_stat.stat.exists
      register: cryptenroll_uefi_result
      ignore_errors: true

    - name: "GDC-TPM-SEAL | Seal LUKS Master Key to TPM 2.0 in Legacy BIOS mode"
      ansible.builtin.shell: |
        systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs= {{ item }}
      environment:
        PASSWORD: "temporary_bootstrap_key_to_be_enrolled_to_tpm"
        TCTI: "device:/dev/tpmrm0"
      loop: "{{ luks_partition_devices.stdout_lines }}"
      when:
        - tpm_device_stat.stat.exists
        - not efi_sys_stat.stat.exists
      register: cryptenroll_bios_result
      ignore_errors: true

    - name: "GDC-TPM-SEAL | Reconfigure crypttab to use systemd-cryptenroll daemon"
      ansible.builtin.replace:
        path: /etc/crypttab
        regexp: '^(\S+)\s+(\S+)\s+/etc/keys/temp_key\.key\s+(\S+)'
        replace: '\1 \2 none \3,tpm2-device=auto,discard'
      register: crypttab_reconfigured
      when:
        - tpm_device_stat.stat.exists
        - (cryptenroll_uefi_result is succeeded and not cryptenroll_uefi_result.skipped | default(false)) or (cryptenroll_bios_result is succeeded and not cryptenroll_bios_result.skipped | default(false))

    - name: "GDC-TPM-SEAL | Rebuild initramfs to pack active TPM unlock hooks"
      ansible.builtin.command: update-initramfs -u -k all
      when:
        - tpm_device_stat.stat.exists
        - crypttab_reconfigured is defined and crypttab_reconfigured.changed

    - name: "GDC-TPM-SEAL | Erase temporary plaintext key file from host filesystem"
      ansible.builtin.file:
        path: /etc/keys/temp_key.key
        state: absent
      when:
        - tpm_device_stat.stat.exists
        - crypttab_reconfigured is defined and crypttab_reconfigured.changed

    - name: "GDC-TPM-SEAL | Purge insecure temporary passcode slot from LUKS keyslots"
      ansible.builtin.shell: |
        systemd-cryptenroll --wipe-slot=password {{ item }}
      environment:
        PASSWORD: "temporary_bootstrap_key_to_be_enrolled_to_tpm"
        TCTI: "device:/dev/tpmrm0"
      loop: "{{ luks_partition_devices.stdout_lines }}"
      when:
        - tpm_device_stat.stat.exists
        - crypttab_reconfigured is defined and crypttab_reconfigured.changed

    - name: "GDC-PROVISION-108 | Signal Installation Completion Success"
      ansible.builtin.debug:
        msg: "SUCCESS: All Ready-Linux Post-Install provisioning tasks and security handshakes completed successfully."

    - name: "GDC-PROVISION-109 | Write success token to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "GDC_BOOTSTRAP_COMPLETE_SUCCESSFULLY" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true
