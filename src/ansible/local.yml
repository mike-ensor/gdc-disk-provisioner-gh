---
# ==============================================================================
# GDC Node First-Boot Self-Test & Ready-Linux Provisioning Playbook
# ==============================================================================
# Executes locally on first boot to transform a raw baseline Ubuntu node
# into a hardened, secure GDC host ready for Kubernetes bootstrapping.
# Coordinated with GDC-SPEC-READY-LINUX specification.
# ==============================================================================

- name: "GDC Ready-Linux Post-Install & Provisioning Suite"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - vars/all.yml

  vars:
    # Toggle to enforce GPG signed commits inside the local ansible-pull runner
    enforce_signed_commits: false
    # Toggle to execute safe offline system upgrade
    trigger_system_upgrade: false

  pre_tasks:
    - name: "GDC-PREFLIGHT | Load initial state to get gdc_primary_interface"
      ansible.builtin.import_tasks: stages/state_initialization.yml
      tags: ["always"]

    - name: "GDC-PREFLIGHT | Assert gdc_primary_interface is defined and has MAC"
      ansible.builtin.assert:
        that:
          - gdc_primary_interface is defined
          - gdc_primary_interface in ansible_interfaces
          - ansible_facts[gdc_primary_interface]['macaddress'] is defined
          - ansible_facts[gdc_primary_interface]['macaddress'] | regex_search('^([0-9a-f]{2}:){5}[0-9a-f]{2}$')
        fail_msg: "Pre-flight failure: Primary interface {{ gdc_primary_interface | default('UNDEFINED') }} is missing or lacks a valid MAC address."
        success_msg: "Pre-flight passed: Primary interface is {{ gdc_primary_interface | default('UNDEFINED') }} with MAC {{ ansible_facts[gdc_primary_interface | default('')]['macaddress'] | default('UNKNOWN') }}"
      tags: ["always"]

    - name: "GDC-PREFLIGHT | Execute Environment Validation Checks"
      ansible.builtin.import_tasks: stages/stage_preflight_checks.yml
      tags: ["always"]

  tasks:
    - name: "GDC-STATE | Initialize and load state facts"
      ansible.builtin.import_tasks: stages/state_initialization.yml
      tags: ["always"]

    # ==============================================================================
    # STAGE 2: FirstBoot (Service Hubs Setup)
    # ==============================================================================
    - name: "FIRST_BOOT | GDC-STATE | Run Stage 2"
      block:
        - name: "FIRST_BOOT | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            first_boot_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            first_boot_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "FIRST_BOOT | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_first_boot.yml
        - name: "FIRST_BOOT | GDC-STATE | Force play end to await scheduled reboot"
          ansible.builtin.meta: end_play
      rescue:
        - name: "GDC-STATE | Record FirstBoot Failure state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/first-boot.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = first_boot_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = first_boot_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": first_boot_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(first_boot_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "first-boot",
                "status": "failed",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }
        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage first-boot --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "GDC-STATE | Fail the play on FirstBoot Setup"
          ansible.builtin.fail:
            msg: "GDC FirstBoot Setup failed!"
      when: gdc_active_stage == 'first-boot'
      tags: ["first-boot"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    - name: "SECOND_BOOT | GDC-STATE | Guard: Halt execution if user requested stop at FIRST_BOOT"
      block:
        - name: "SECOND_BOOT | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "SECOND_BOOT | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when:
        - stop_stage == "FIRST_BOOT"
        - first_boot_state.status == "completed"
      tags: ["second-boot"]

    # ==============================================================================
    # STAGE 3: SecondBoot (Stability & Unsealing Verification)
    # ==============================================================================
    - name: "SECOND_BOOT | GDC-STATE | Run Stage 3"
      block:
        - name: "SECOND_BOOT | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            second_boot_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            second_boot_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "SECOND_BOOT | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_second_boot.yml
      rescue:
        - name: "GDC-STATE | Record SecondBoot Failure state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/second-boot.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = second_boot_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = second_boot_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": second_boot_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(second_boot_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "second-boot",
                "status": "failed",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }
        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage second-boot --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "GDC-STATE | Fail the play on SecondBoot Verification"
          ansible.builtin.fail:
            msg: "GDC SecondBoot Verification failed!"
      when: gdc_active_stage == 'second-boot'
      tags: ["second-boot"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    - name: "LINUX_READY | GDC-STATE | Guard: Halt execution if user requested stop at SECOND_BOOT"
      block:
        - name: "LINUX_READY | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "LINUX_READY | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when:
        - stop_stage == "SECOND_BOOT"
        - second_boot_state.status == "completed"
      tags: ["linux-ready"]

    # ==============================================================================
    # STAGE 4: LinuxReady (Foundations, Tuning, Hardening)
    # ==============================================================================
    - name: "LINUX_READY | GDC-STATE | Run Stage 4"
      block:
        - name: "LINUX_READY | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            linux_ready_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            linux_ready_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "LINUX_READY | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_linux_ready.yml
      rescue:
        - name: "GDC-STATE | Record LinuxReady Failure state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/linux-ready.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = linux_ready_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = linux_ready_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": linux_ready_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(linux_ready_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "LINUX_READY",
                "status": "failed",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }
        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage linux-ready --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "GDC-STATE | Fail the play on LinuxReady Hardening"
          ansible.builtin.fail:
            msg: "GDC LinuxReady Hardening failed!"
      when: gdc_active_stage == 'linux-ready'
      tags: ["linux-ready"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    # ==============================================================================
    # STAGE 4.5: Kernel/System Pending Reboots (HWE Kernel Application)
    # ==============================================================================
    - name: "GDC-STATE | Check if system requires a reboot (e.g. for HWE kernel)"
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required_file
      tags: ["linux-ready", "cluster-ready"]

    - name: "GDC-STATE | Perform Pending Reboots before continuing"
      block:
        - name: "GDC-STATE | Trigger local background reboot to apply pending kernel/system updates"
          ansible.builtin.shell: |
            nohup bash -c 'sleep 10 && shutdown -r now "GDC Provisioner: Applying pending kernel/system updates before ClusterReady."' >/dev/null 2>&1 &
          async: 0
          poll: 0
        
        - name: "GDC-STATE | Force play end to await scheduled reboot"
          ansible.builtin.meta: end_play
      when: 
        - stop_stage != "LINUX_READY"
        - reboot_required_file.stat.exists
      tags: ["linux-ready", "cluster-ready"]


    - name: "CLUSTER_READY | GDC-STATE | Guard: Halt execution if user requested stop at LINUX_READY"
      block:
        - name: "CLUSTER_READY | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "CLUSTER_READY | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when: 
        - stop_stage == "LINUX_READY"
        - linux_ready_state.status == "completed"
      tags: ["cluster-ready"]

    # ==============================================================================
    # STAGE 5: ClusterReady (Machine Config & NodeAgent Integration)
    # ==============================================================================
    - name: "CLUSTER_READY | GDC-STATE | Run Stage 5"
      block:
        - name: "CLUSTER_READY | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            cluster_ready_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            cluster_ready_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "CLUSTER_READY | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_cluster_ready.yml
      rescue:
        - name: "GDC-STATE | Determine if failure was due to waiting on peers"
          ansible.builtin.set_fact:
            is_waiting: "{{ ansible_failed_result.msg is defined and ansible_failed_result.msg == 'WAITING_ON_PEERS' }}"

        - name: "GDC-STATE | Record ClusterReady state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/cluster-ready.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = cluster_ready_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = cluster_ready_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": cluster_ready_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(cluster_ready_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "CLUSTER_READY",
                "status": "{{ 'IN_PROGRESS' if is_waiting else 'FAILED' }}",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }

        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage cluster-ready --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false

        - name: "GDC-STATE | Fail the play on ClusterReady Configuration"
          ansible.builtin.fail:
            msg: "GDC ClusterReady Configuration failed!"
          when: not (is_waiting | default(false))

        - name: "GDC-STATE | End play gracefully if waiting on peers"
          ansible.builtin.meta: end_play
          when: is_waiting | default(false)
      when: gdc_active_stage == 'cluster-ready'
      tags: ["cluster-ready"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    - name: "CLUSTER_TURNUP | GDC-STATE | Guard: Halt execution if user requested stop at CLUSTER_READY"
      block:
        - name: "CLUSTER_TURNUP | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "CLUSTER_TURNUP | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when: 
        - stop_stage == "CLUSTER_READY"
        - cluster_ready_state.status == "completed"
      tags: ["cluster-turnup"]

    # ==============================================================================
    # STAGE 6: ClusterTurnup (Standalone / HA Cluster Inception)
    # ==============================================================================
    - name: "CLUSTER_TURNUP | GDC-STATE | Run Stage 6"
      block:
        - name: "CLUSTER_TURNUP | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            cluster_turnup_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            cluster_turnup_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "CLUSTER_TURNUP | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_cluster_turnup.yml
      rescue:
        - name: "GDC-STATE | Record ClusterTurnup Failure state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/cluster-turnup.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = cluster_turnup_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({"msg": "Error creating a cluster. Check the 'bmctl-workspace' logs for details"}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('Error creating a cluster. Check the \'bmctl-workspace\' logs for details')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = cluster_turnup_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": cluster_turnup_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(cluster_turnup_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "CLUSTER_TURNUP",
                "status": "failed",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }
        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage cluster-turnup --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "GDC-STATE | Fail the play on ClusterTurnup Inception"
          ansible.builtin.fail:
            msg: "GDC ClusterTurnup Inception failed!"
      when: gdc_active_stage == 'cluster-turnup'
      tags: ["cluster-turnup"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    - name: "CLUSTER_COMPLETE | GDC-STATE | Guard: Halt execution if user requested stop at CLUSTER_TURNUP"
      block:
        - name: "CLUSTER_COMPLETE | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "CLUSTER_COMPLETE | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when: 
        - stop_stage == "CLUSTER_TURNUP"
        - cluster_turnup_state.status == "completed"
      tags: ["cluster-turnup"]

    # ==============================================================================
    # STAGE 7: PostCluster (Cluster Health & Workload Verification)
    # ==============================================================================
    - name: "POST_CLUSTER | GDC-STATE | Run Stage 7"
      block:
        - name: "POST_CLUSTER | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            post_cluster_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            post_cluster_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "POST_CLUSTER | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_post_cluster.yml
      rescue:
        - name: "GDC-STATE | Record PostCluster Failure state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/post-validation.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = post_cluster_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = post_cluster_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": post_cluster_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(post_cluster_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "POST_CLUSTER",
                "status": "failed",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }
        - name: "GDC-STATE | Create post-cluster.json compatibility symlink"
          ansible.builtin.file:
            src: /var/gdc-install/state/post-validation.json
            dest: /var/gdc-install/state/post-cluster.json
            state: link
            force: true
        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage post-cluster --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "GDC-STATE | Fail the play on PostCluster Verification"
          ansible.builtin.fail:
            msg: "GDC PostCluster Verification failed!"
      when: gdc_active_stage == 'post-cluster'
      tags: ["post-cluster"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    - name: "POST_CLUSTER | GDC-STATE | Guard: Halt execution if user requested stop at POST_CLUSTER"
      block:
        - name: "POST_CLUSTER | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "POST_CLUSTER | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when: 
        - stop_stage in ["POST_CLUSTER", "POST-CLUSTER", "POST_VALIDATION", "POST-VALIDATION"]
        - post_cluster_state is defined and post_cluster_state.status == "completed"
      tags: ["post-cluster"]

    # ==============================================================================
    # STAGE 8: Upkeep (Continuous Desired-State & Provisioning Timers)
    # ==============================================================================
    - name: "UPKEEP | GDC-STATE | Run Stage 8"
      block:
        - name: "UPKEEP | GDC-TIMING | Record Stage Start"
          ansible.builtin.set_fact:
            upkeep_start_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
            upkeep_start_epoch: "{{ now(utc=true).strftime('%s') | int }}"
        - name: "UPKEEP | GDC-STATE | Execute"
          ansible.builtin.import_tasks: stages/stage_upkeep.yml
      rescue:
        - name: "GDC-STATE | Record Upkeep Failure state"
          ansible.builtin.copy:
            dest: /var/gdc-install/state/update-upkeep.json
            owner: root
            group: root
            mode: '0644'
            content: |
              {% set _evidence = upkeep_evidence | default({}) %}
              {% set _raw_err = ansible_failed_result | default({}) %}
              {% set _error_detail = {} %}
              {% if _raw_err is mapping %}
                {% set _msg = _raw_err.msg | default(_raw_err.message | default('')) %}
                {% set _ = _error_detail.update({
                  "failed": _raw_err.failed | default(true),
                  "msg": (_msg | string)[:10000] if _msg else 'Task execution failed'
                }) %}
                {% if _raw_err.rc is defined %}
                  {% set _ = _error_detail.update({"rc": _raw_err.rc}) %}
                {% endif %}
                {% if _raw_err.cmd is defined %}
                  {% set _ = _error_detail.update({"cmd": _raw_err.cmd}) %}
                {% endif %}
                {% set _stdout = _raw_err.stdout | default('') %}
                {% if _stdout is string and _stdout %}
                  {% set _ = _error_detail.update({"stdout": _stdout | clean_terminal_output(50)}) %}
                {% endif %}
                {% set _stderr = _raw_err.stderr | default('') %}
                {% if _stderr is string and _stderr %}
                  {% set _ = _error_detail.update({"stderr": _stderr | clean_terminal_output(50)}) %}
                {% endif %}
              {% else %}
                {% set _ = _error_detail.update({"msg": (_raw_err | string)[:10000]}) %}
              {% endif %}
              {% set _end_time = now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') %}
              {% set _end_epoch = now(utc=true).strftime('%s') | int %}
              {% set _start_epoch = upkeep_start_epoch | default(_end_epoch) | int %}
              {% set _duration = [_end_epoch - _start_epoch, 0] | max %}
              {% set _timing = {
                "start_time": upkeep_start_time | default(_end_time),
                "end_time": _end_time,
                "duration_seconds": _duration,
                "overall_provisioning_start_time": provisioning_start_time | default(upkeep_start_time | default(_end_time))
              } %}
              {% set _ = _evidence.update({"timing": _timing, "error_details": _error_detail}) %}
              {
                "stage": "UPDATE_UPKEEP",
                "status": "failed",
                "timestamp": "{{ _end_time }}",
                "evidence": {{ _evidence | to_json }}
              }
        - name: "GDC-STATE | Create upkeep.json compatibility symlink"
          ansible.builtin.file:
            src: /var/gdc-install/state/update-upkeep.json
            dest: /var/gdc-install/state/upkeep.json
            state: link
            force: true
        - name: "GDC-STATE | Trigger Failure Telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --stage upkeep --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "GDC-STATE | Fail the play on Upkeep Setup"
          ansible.builtin.fail:
            msg: "GDC Upkeep Setup failed!"
      when: gdc_active_stage == 'upkeep'
      tags: ["upkeep"]

    - name: "GDC-STATE | Advance active stage"
      ansible.builtin.set_fact:
        gdc_active_stage: "{{ lookup('gdc_state') }}"
      tags: ["always"]

    - name: "UPKEEP | GDC-STATE | Guard: Halt execution if user requested stop at UPKEEP"
      block:
        - name: "UPKEEP | GDC-STATE | Collect final diagnostics before halting"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            fi
          changed_when: false
          failed_when: false
        - name: "UPKEEP | GDC-STATE | Halt execution"
          ansible.builtin.meta: end_play
      when: 
        - stop_stage in ["UPKEEP", "UPDATE_UPKEEP", "UPDATE-UPKEEP"]
        - upkeep_state is defined and upkeep_state.status == "completed"
      tags: ["upkeep"]

    - name: "GDC-STATE | Run final telemetry"
      block:
        - name: "GDC-STATE | Always execute diagnostics and upload telemetry"
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/gdc-collector ]; then
              /usr/local/bin/gdc-collector --companion-url="{{ gdc_companion_reports_url | default('') }}"
            else
              echo "[!] Diagnostics collector script /usr/local/bin/gdc-collector not found or not executable!" >&2
              exit 1
            fi
          changed_when: false
          failed_when: false
