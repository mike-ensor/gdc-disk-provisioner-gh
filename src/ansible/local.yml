---
# ==============================================================================
# GDC Node First-Boot Self-Test & Ready-Linux Provisioning Playbook
# ==============================================================================
# Executes locally on first boot to transform a raw baseline Ubuntu node
# into a hardened, secure GDC host ready for Kubernetes bootstrapping.
# Coordinated with GDC-SPEC-READY-LINUX specification.
# ==============================================================================

- name: "GDC Ready-Linux Post-Install & Provisioning Suite"
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  gather_subset:
    - "!network"
    - "!hardware"

  vars_files:
    - vars/all.yml

  vars:
    # Toggle to enforce GPG signed commits inside the local ansible-pull runner
    enforce_signed_commits: false
    # Toggle to execute safe offline system upgrade
    trigger_system_upgrade: false

  tasks:
    - name: Run GDC Ready-Linux Post-Install Provisioning Suite
      block:
        - name: Run service_hubs role
          include_role:
            name: service_hubs
        - name: Run host_foundations role
          include_role:
            name: host_foundations
        - name: Run system_tuning role
          include_role:
            name: system_tuning
        - name: Run security_hardening role
          include_role:
            name: security_hardening
      always:
        - name: Always execute diagnostics and upload telemetry
          ansible.builtin.shell: |
            if [ -x /usr/local/bin/collect-node-diagnostics.sh ]; then
              /usr/local/bin/collect-node-diagnostics.sh
            else
              echo "[!] Diagnostics collector script /usr/local/bin/collect-node-diagnostics.sh not found or not executable!" >&2
              exit 1
            fi
          ignore_errors: true
