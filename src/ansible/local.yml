---
# ==============================================================================
# GDC Node First-Boot Self-Test & Ready-Linux Provisioning Playbook
# ==============================================================================
# Executes locally on first boot to:
#   1. Validate Service Hub readiness (Gitea Port 3000, Nexus Port 8081).
#   2. Query and log physical disk partition structures.
#   3. Perform offline system-wide safe package upgrades.
#   4. Install our variable-driven list of core system packages (offline).
#   5. Persistently enable Gitea and Nexus daemons on the host.
#   6. Configure the persistent `ansible-pull` cron executor with GPG signed-commit enforcement.
# ==============================================================================

- name: "GDC Ready-Linux Post-Install & Provisioning Suite"
  hosts: localhost
  connection: local
  gather_facts: true
  gather_subset:
    - "!network"
    - "!hardware"

  vars:
    # Target package list and specific versions to install during post-install
    # (Matches our variables inside build.env)
    post_install_packages:
      - "git"
    
    # Toggle to enforce GPG signed commits inside the local ansible-pull runner
    # Set to 'false' during initial development; set to 'true' for production.
    enforce_signed_commits: false

  tasks:
    - name: "GDC-LOG-CON | Log Ansible startup to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "--- GDC ANSIBLE PROVISIONER STARTING ---" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true

    # --------------------------------------------------------------------------
    # Stage 1: Local Service Readiness Checks (Hubs)
    # --------------------------------------------------------------------------
    - name: "GDC-VERIFY-001 | Check Gitea Service Hub Readiness (Port 3000)"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 3000
        state: started
        timeout: 300
        msg: "Timeout waiting for Gitea to listen on local port 3000. Check target logs."

    - name: "GDC-VERIFY-002 | Check Nexus Service Hub Readiness (Port 8081)"
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8081
        state: started
        timeout: 300
        msg: "Timeout waiting for Nexus to listen on local port 8081. Check target logs."

    - name: "GDC-VERIFY-003 | Confirm Service Endpoints are Accessible"
      ansible.builtin.debug:
        msg: "Success: Local Service Boundary Hubs (Gitea on Port 3000 and Nexus on Port 8081) are fully accessible."

    - name: "GDC-LOG-CON | Log services ready to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "--- GDC LOCAL SERVICE HUBS OPERATIONAL & READY ---" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true

    # --------------------------------------------------------------------------
    # Stage 1b: Configure Local Nexus Repositories
    # --------------------------------------------------------------------------
    - name: "GDC-NEXUS-INIT | Check if Nexus is actually installed"
      ansible.builtin.stat:
        path: /var/lib/nexus/nexus-bin/bin/nexus
      register: nexus_binary_installed

    - name: "GDC-NEXUS-INIT | Wait for Nexus REST API to become responsive"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/status"
        method: GET
        status_code: 200
      register: nexus_api_status
      until: nexus_api_status.status is defined and nexus_api_status.status == 200
      retries: 45
      delay: 5
      when: nexus_binary_installed.stat.exists

    - name: "GDC-NEXUS-INIT | Check if provision.yml exists"
      ansible.builtin.stat:
        path: /etc/gdc/provision.yml
      register: gdc_provision_file
      when: nexus_binary_installed.stat.exists

    - name: "GDC-NEXUS-INIT | Load provision.yml variables"
      ansible.builtin.include_vars:
        file: /etc/gdc/provision.yml
      when:
        - nexus_binary_installed.stat.exists
        - gdc_provision_file.stat.exists

    - name: "GDC-NEXUS-INIT | Set fact for Nexus target admin password"
      ansible.builtin.set_fact:
        nexus_admin_pass: "{{ nexus_admin_password | default('default-password-123') }}"
      when: nexus_binary_installed.stat.exists

    - name: "GDC-NEXUS-INIT | Check if Nexus admin.password exists (first boot)"
      ansible.builtin.stat:
        path: /var/lib/nexus/sonatype-work/nexus3/admin.password
      register: nexus_admin_password_file
      when: nexus_binary_installed.stat.exists

    - name: "GDC-NEXUS-INIT | Read initial Nexus admin password"
      ansible.builtin.slurp:
        src: /var/lib/nexus/sonatype-work/nexus3/admin.password
      register: slurped_password_file
      when:
        - nexus_binary_installed.stat.exists
        - nexus_admin_password_file.stat.exists

    - name: "GDC-NEXUS-INIT | Set initial admin password variable"
      ansible.builtin.set_fact:
        nexus_initial_password: "{{ slurped_password_file.content | b64decode | trim }}"
      when:
        - nexus_binary_installed.stat.exists
        - nexus_admin_password_file.stat.exists

    - name: "GDC-NEXUS-INIT | Reset Nexus admin password to configured secure password"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/security/users/admin/change-password"
        method: PUT
        user: admin
        password: "{{ nexus_initial_password }}"
        force_basic_auth: true
        body_format: raw
        body: "{{ nexus_admin_pass }}"
        status_code: 204
      when:
        - nexus_binary_installed.stat.exists
        - nexus_admin_password_file.stat.exists
      register: password_reset_result

    - name: "GDC-NEXUS-INIT | Get list of existing repositories"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories"
        method: GET
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        status_code: 200
      register: existing_repos_result
      when: nexus_binary_installed.stat.exists
      ignore_errors: true

    - name: "GDC-NEXUS-INIT | Set fact for existing repositories names"
      ansible.builtin.set_fact:
        existing_repos: "{{ existing_repos_result.json | map(attribute='name') | list }}"
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos_result is defined
        - existing_repos_result.status == 200

    # Create gdc-apt-hosted if missing
    - name: "GDC-NEXUS-INIT | Create gdc-apt-hosted repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/apt/hosted"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-apt-hosted"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
            writePolicy: "allow"
          apt:
            distribution: "noble"
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-apt-hosted' not in existing_repos"

    # Create gdc-apt-proxy if missing
    - name: "GDC-NEXUS-INIT | Create gdc-apt-proxy repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/apt/proxy"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-apt-proxy"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
          proxy:
            remoteUrl: "http://archive.ubuntu.com/ubuntu/"
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          apt:
            distribution: "noble"
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-apt-proxy' not in existing_repos"

    # Create gdc-docker-hosted if missing (Port 5002)
    - name: "GDC-NEXUS-INIT | Create gdc-docker-hosted repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/docker/hosted"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-docker-hosted"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
            writePolicy: "allow"
          docker:
            v1Enabled: false
            forceBasicAuth: true
            httpPort: 5002
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-docker-hosted' not in existing_repos"

    # Create gdc-docker-proxy if missing
    - name: "GDC-NEXUS-INIT | Create gdc-docker-proxy repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/docker/proxy"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-docker-proxy"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
          proxy:
            remoteUrl: "https://registry-1.docker.io"
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
          docker:
            v1Enabled: false
            forceBasicAuth: true
          dockerProxy:
            indexType: "REGISTRY"
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-docker-proxy' not in existing_repos"

    # Create gdc-docker-group if missing (Port 5001)
    - name: "GDC-NEXUS-INIT | Create gdc-docker-group repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/docker/group"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-docker-group"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
          group:
            memberNames:
              - "gdc-docker-hosted"
              - "gdc-docker-proxy"
          docker:
            v1Enabled: false
            forceBasicAuth: true
            httpPort: 5001
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-docker-group' not in existing_repos"

    # Create gdc-raw-hosted if missing
    - name: "GDC-NEXUS-INIT | Create gdc-raw-hosted repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/raw/hosted"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-raw-hosted"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
            writePolicy: "allow"
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-raw-hosted' not in existing_repos"

    # Create gdc-raw-proxy if missing
    - name: "GDC-NEXUS-INIT | Create gdc-raw-proxy repository"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8081/service/rest/v1/repositories/raw/proxy"
        method: POST
        user: admin
        password: "{{ nexus_admin_pass }}"
        force_basic_auth: true
        body_format: json
        body:
          name: "gdc-raw-proxy"
          online: true
          storage:
            blobStoreName: "default"
            strictContentTypeValidation: true
          proxy:
            remoteUrl: "https://huggingface.co"
            contentMaxAge: 1440
            metadataMaxAge: 1440
          negativeCache:
            enabled: true
            timeToLive: 1440
        status_code: 201
      when:
        - nexus_binary_installed.stat.exists
        - existing_repos is defined
        - "'gdc-raw-proxy' not in existing_repos"

    # --------------------------------------------------------------------------
    # Stage 2: Retrieve Disk and Block Partition Layout
    # --------------------------------------------------------------------------
    - name: "GDC-VERIFY-004 | Query System Block Devices (lsblk)"
      ansible.builtin.command: lsblk -o NAME,FSTYPE,SIZE,MOUNTPOINTS
      register: lsblk_result
      changed_when: false

    - name: "GDC-VERIFY-005 | Print Partition Layout"
      ansible.builtin.debug:
        var: lsblk_result.stdout_lines

    # --------------------------------------------------------------------------
    # Stage 3: Test Outbound Network (With air-gap fallback)
    # --------------------------------------------------------------------------
    - name: "GDC-VERIFY-006 | Ping External DNS Server (8.8.8.8)"
      ansible.builtin.command: ping -c 3 8.8.8.8
      register: ping_result
      changed_when: false
      ignore_errors: true

    - name: "GDC-VERIFY-007 | Report Outbound Network State"
      ansible.builtin.debug:
        msg: >
          {% if ping_result.rc == 0 %}
          Outbound Internet Network Ping succeeded! Server has route to the public internet.
          {% else %}
          Outbound Internet Network Ping failed or is blocked. Running in offline/air-gapped mode.
          {% endif %}

    # --------------------------------------------------------------------------
    # Stage 4: Persistent Service Configurations
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION-101 | Ensure Gitea and Nexus are persistently Enabled & Running"
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - gitea
        - nexus

    # --------------------------------------------------------------------------
    # Stage 4b: Hermetic Offline Package Repository Setup
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION | Ensure SSH privilege separation directory exists"
      ansible.builtin.file:
        path: /run/sshd
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "GDC-PROVISION | Ensure GDC custom SSH configurations are deployed"
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/gdc.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          # Generated by GDC Provisioner Playbook
          # Disable reverse DNS lookup to prevent login hangs in offline or air-gapped subnets
          UseDNS no

    - name: "GDC-PROVISION | Disable SSH socket activation to prevent port conflicts on Ubuntu 24.04"
      ansible.builtin.systemd:
        name: ssh.socket
        enabled: false
        state: stopped
      ignore_errors: true

    - name: "GDC-PROVISION | Enable and start persistent SSH service daemon"
      ansible.builtin.systemd:
        name: ssh
        enabled: true
        state: restarted
      ignore_errors: true

    - name: "GDC-OFFLINE-APT | Ensure GDC APT keyrings directory exists"
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: "GDC-OFFLINE-APT | Register GDC Nexus trusted keyring"
      ansible.builtin.copy:
        src: /etc/ssl/certs/gdc-release.gpg
        dest: /etc/apt/keyrings/gdc-nexus.gpg
        owner: root
        group: root
        mode: '0644'
        remote_src: true
      ignore_errors: true

    - name: "GDC-OFFLINE-APT | Write DEB822 local loopback Nexus sources"
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/gdc-nexus.sources
        owner: root
        group: root
        mode: '0644'
        content: |
          # Local GDC Hosted (Sideloaded Update) Repository
          Enabled: yes
          Types: deb
          URIs: http://127.0.0.1:8081/repository/gdc-apt-hosted/
          Suites: noble
          Components: main restricted universe multiverse
          Signed-By: /etc/apt/keyrings/gdc-nexus.gpg

          # Local GDC Proxy (Upstream Cache) Repository
          Enabled: yes
          Types: deb
          URIs: http://127.0.0.1:8081/repository/gdc-apt-proxy/
          Suites: noble
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

    - name: "GDC-OFFLINE-APT | Enforce Hosted APT Priority Pinning"
      ansible.builtin.copy:
        dest: /etc/apt/preferences.d/gdc-nexus-pin
        owner: root
        group: root
        mode: '0644'
        content: |
          Package: *
          Pin: release o=gdc-apt-hosted
          Pin-Priority: 1001

    - name: "GDC-OFFLINE-APT | Check for active public Ubuntu sources"
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/ubuntu.sources
      register: public_sources_stat

    - name: "GDC-OFFLINE-APT | Deactivate public Ubuntu DEB822 sources"
      ansible.builtin.command: mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.bak
      when: public_sources_stat.stat.exists
      changed_when: true

    - name: "GDC-OFFLINE-APT | Check for standard sources.list"
      ansible.builtin.stat:
        path: /etc/apt/sources.list
      register: standard_sources_stat

    - name: "GDC-OFFLINE-APT | Deactivate standard sources.list"
      ansible.builtin.command: mv /etc/apt/sources.list /etc/apt/sources.list.bak
      when: standard_sources_stat.stat.exists
      changed_when: true

    # --------------------------------------------------------------------------
    # Stage 5: System Upgrades & Variable-Driven Package Installations
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION-102 | Perform Complete Offline System Package Upgrade"
      ansible.builtin.apt:
        upgrade: safe
        update_cache: false
      register: apt_upgrade_result
      ignore_errors: true
      when: trigger_system_upgrade | default(false)

    - name: "GDC-PROVISION-103 | Log System Package Upgrade Results"
      ansible.builtin.debug:
        msg: "Safe system-wide offline package upgrade executed successfully."
      when:
        - apt_upgrade_result is succeeded
        - trigger_system_upgrade | default(false)

    - name: "GDC-LOG-CON | Log packages wait to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "--- GDC SYSTEM PACKAGES INSTALLATION STARTED ---" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true

    - name: "GDC-PROVISION-104a | Check if packages are already installed"
      ansible.builtin.command: dpkg -s {{ item }}
      loop: "{{ post_install_packages }}"
      register: package_check
      ignore_errors: true
      changed_when: false

    - name: "GDC-PROVISION-104 | Install GDC Configured Post-Install Packages"
      ansible.builtin.apt:
        name: "{{ item.item }}"
        state: present
        update_cache: false
      loop: "{{ package_check.results }}"
      when: item.rc != 0
      register: apt_install_result

    # --------------------------------------------------------------------------
    # Stage 6: Configure Persistent GPG Signed-Commits for Ansible-Pull
    # --------------------------------------------------------------------------
    - name: "GDC-PROVISION-105 | Create systemd environment file for gdc-provisioner"
      ansible.builtin.copy:
        dest: /etc/default/gdc-provision
        owner: root
        group: root
        mode: '0644'
        content: |
          # gdc-provisioner execution environment configurations
          # Enforce signed commits toggle mapping
          ANSIBLE_PULL_FLAGS="{% if enforce_signed_commits %}--verify-commit{% else %}{% endif %}"
      register: env_config_result

    - name: "GDC-PROVISION-106 | Setup Local Gitea GPG Verification Keys"
      ansible.builtin.copy:
        src: /etc/ssl/certs/gdc-release.gpg
        dest: /etc/gpg/gdc-release.gpg
        owner: root
        group: root
        mode: '0644'
        remote_src: true
      when: enforce_signed_commits
      ignore_errors: true

    - name: "GDC-PROVISION-107 | Ensure legacy cron job is absent"
      ansible.builtin.cron:
        name: "Run GDC local config pull-sync (30 min cycles)"
        state: absent

    - name: "GDC-PROVISION-107b | Ensure daily systemd timer is enabled and running"
      ansible.builtin.systemd:
        name: gdc-provision.timer
        enabled: true
        state: started

    # --------------------------------------------------------------------------
    # Stage 8: Administrative Configurations & OS Slimming
    # --------------------------------------------------------------------------
    - name: "GDC-ADMIN-SETUP | Ensure gdc-admin group exists"
      ansible.builtin.group:
        name: gdc-admin
        state: present
        system: true

    - name: "GDC-ADMIN-SETUP | Ensure gdc-admin user exists"
      ansible.builtin.user:
        name: gdc-admin
        group: gdc-admin
        shell: /bin/bash
        state: present
        system: true
        create_home: true
        home: /home/gdc-admin

    - name: "GDC-ADMIN-SETUP | Set up secure passwordless sudo for gdc-admin"
      ansible.builtin.copy:
        dest: /etc/sudoers.d/gdc-admin
        owner: root
        group: root
        mode: '0440'
        content: |
          gdc-admin ALL=(ALL) NOPASSWD:ALL

    - name: "GDC-ADMIN-SETUP | Configure authorized SSH keys for gdc-admin"
      ansible.builtin.file:
        path: /home/gdc-admin/.ssh
        state: directory
        owner: gdc-admin
        group: gdc-admin
        mode: '0700'

    - name: "GDC-ADMIN-SETUP | Inject administrative public SSH key for gdc-admin"
      ansible.builtin.copy:
        dest: /home/gdc-admin/.ssh/authorized_keys
        owner: gdc-admin
        group: gdc-admin
        mode: '0600'
        content: "{{ ssh_pub_key | default('') }}"
      when:
        - ssh_pub_key is defined
        - ssh_pub_key != ""

    - name: "GDC-SLIMMING | Purge redundant heavy system packages"
      ansible.builtin.apt:
        name:
          - snapd
          - lxd
          - x11-common
        state: absent
        purge: true
      ignore_errors: true

    # --------------------------------------------------------------------------
    # Stage 7: Hardware Security (TPM 2.0 LUKS Sealing & Passcode Purging)
    # --------------------------------------------------------------------------
    - name: "GDC-TPM-SEAL | Verify physical or emulated TPM 2.0 availability"
      ansible.builtin.stat:
        path: /dev/tpmrm0
      register: tpm_device_stat

    - name: "GDC-TPM-SEAL | Retrieve GDC LUKS system device partitions"
      ansible.builtin.shell: blkid -t TYPE=crypto_LUKS -o device
      register: luks_partition_devices
      changed_when: false
      failed_when: luks_partition_devices.stdout == ""
      when: tpm_device_stat.stat.exists

    - name: "GDC-TPM-SEAL | Check if system is booted in UEFI mode"
      ansible.builtin.stat:
        path: /sys/firmware/efi
      register: efi_sys_stat

    - name: "GDC-TPM-SEAL | Seal LUKS Master Key to TPM 2.0 PCR registers (0+2+7) in UEFI mode"
      ansible.builtin.shell: |
        systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs=0+2+7 --unlock-key-file=/etc/keys/temp_key.key {{ item }}
      environment:
        TCTI: "device:/dev/tpmrm0"
      loop: "{{ luks_partition_devices.stdout_lines }}"
      when:
        - tpm_device_stat.stat.exists
        - efi_sys_stat.stat.exists
      register: cryptenroll_uefi_result
      ignore_errors: true

    - name: "GDC-TPM-SEAL | Seal LUKS Master Key to TPM 2.0 in Legacy BIOS mode"
      ansible.builtin.shell: |
        systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs= --unlock-key-file=/etc/keys/temp_key.key {{ item }}
      environment:
        TCTI: "device:/dev/tpmrm0"
      loop: "{{ luks_partition_devices.stdout_lines }}"
      when:
        - tpm_device_stat.stat.exists
        - not efi_sys_stat.stat.exists
      register: cryptenroll_bios_result
      ignore_errors: true

    - name: "GDC-TPM-SEAL | Reconfigure crypttab to use systemd-cryptenroll daemon"
      ansible.builtin.replace:
        path: /etc/crypttab
        regexp: '^(\S+)\s+(\S+)\s+/etc/keys/temp_key\.key\s+(\S+)'
        replace: '\1 \2 none \3,tpm2-device=auto,discard'
      register: crypttab_reconfigured
      when:
        - tpm_device_stat.stat.exists
        - (cryptenroll_uefi_result is succeeded and not cryptenroll_uefi_result.skipped | default(false)) or (cryptenroll_bios_result is succeeded and not cryptenroll_bios_result.skipped | default(false))

    - name: "GDC-TPM-SEAL | Rebuild initramfs to pack active TPM unlock hooks"
      ansible.builtin.command: update-initramfs -u -k all
      when:
        - tpm_device_stat.stat.exists
        - crypttab_reconfigured is defined and crypttab_reconfigured.changed

    - name: "GDC-TPM-SEAL | Purge insecure temporary passcode slot from LUKS keyslots"
      ansible.builtin.shell: |
        systemd-cryptenroll --wipe-slot=password --unlock-key-file=/etc/keys/temp_key.key {{ item }}
      environment:
        TCTI: "device:/dev/tpmrm0"
      loop: "{{ luks_partition_devices.stdout_lines }}"
      when:
        - tpm_device_stat.stat.exists
        - crypttab_reconfigured is defined and crypttab_reconfigured.changed

    - name: "GDC-TPM-SEAL | Erase temporary plaintext key file from host filesystem"
      ansible.builtin.file:
        path: /etc/keys/temp_key.key
        state: absent
      when:
        - tpm_device_stat.stat.exists
        - crypttab_reconfigured is defined and crypttab_reconfigured.changed

    - name: "GDC-PROVISION | Log SSH daemon status and routing tables to serial console for diagnostics"
      ansible.builtin.shell: |
        echo "=== DEBUG: SSH Daemon Status ===" > /dev/ttyS0
        systemctl status ssh >> /dev/ttyS0 || true
        echo "=== DEBUG: SSH Daemon Journal ===" > /dev/ttyS0
        journalctl -u ssh -n 50 >> /dev/ttyS0 || true
        echo "=== DEBUG: Active Listening Sockets ===" > /dev/ttyS0
        ss -ltunp >> /dev/ttyS0 || true
        echo "=== DEBUG: Listing of /etc/netplan ===" > /dev/ttyS0
        ls -la /etc/netplan/ >> /dev/ttyS0 || true
        echo "=== DEBUG: Netplan Configurations ===" > /dev/ttyS0
        cat /etc/netplan/* >> /dev/ttyS0 || true
        echo "=== DEBUG: Netplan Status ===" > /dev/ttyS0
        netplan status --all >> /dev/ttyS0 || true
        echo "=== DEBUG: Netplan Info ===" > /dev/ttyS0
        netplan info >> /dev/ttyS0 || true
        echo "=== DEBUG: Netplan Generate Output ===" > /dev/ttyS0
        netplan generate >> /dev/ttyS0 2>&1 || true
        echo "=== DEBUG: Generated Network Files ===" > /dev/ttyS0
        ls -la /run/systemd/network/ >> /dev/ttyS0 || true
        echo "=== DEBUG: Systemd-networkd Status ===" > /dev/ttyS0
        systemctl status systemd-networkd >> /dev/ttyS0 || true
        echo "=== DEBUG: Systemd-networkd Journal ===" > /dev/ttyS0
        journalctl -u systemd-networkd -n 50 >> /dev/ttyS0 || true
        echo "=== DEBUG: Routing Tables ===" > /dev/ttyS0
        ip route show table all >> /dev/ttyS0 || true
        echo "=== DEBUG: IP Addresses ===" > /dev/ttyS0
        ip addr show >> /dev/ttyS0 || true
      ignore_errors: true
      changed_when: false

    - name: "GDC-PROVISION-108 | Signal Installation Completion Success"
      ansible.builtin.debug:
        msg: "SUCCESS: All Ready-Linux Post-Install provisioning tasks and security handshakes completed successfully."

    - name: "GDC-PROVISION-109 | Write success token to serial console"
      ansible.builtin.shell: |
        timeout 3 sh -c 'echo "GDC_BOOTSTRAP_COMPLETE_SUCCESSFULLY" > /dev/ttyS0' || true
      changed_when: false
      ignore_errors: true
