---
# ==============================================================================
# Role Tasks: security_hardening
# ==============================================================================
# Tasks 11 and 12, as well as critical security configurations (SSH, TPM 2.0 LUKS,
# and systemd-cryptenroll integration) and diagnostic signaling.
# ==============================================================================

# --------------------------------------------------------------------------
# Task 11: Security Hardening (UFW & Unattended Upgrades)
# --------------------------------------------------------------------------
- name: "GDC-TASK-11 | Populate active system service facts"
  ansible.builtin.service_facts:
  tags: ["strictly-local"]

- name: "GDC-TASK-11 | Ensure UFW is stopped and disabled"
  ansible.builtin.systemd:
    name: ufw
    enabled: false
    state: stopped
    masked: true
  when: "'ufw.service' in services or 'ufw' in services"
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-11 | Ensure unattended-upgrades configuration auto-reboot is disabled"
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'
  tags: ["strictly-local"]

- name: "GDC-TASK-11 | Deploy persistent 20auto-upgrades config"
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  tags: ["strictly-local"]
- name: "GDC-TASK-11 | Unmask and enable automatic upgrade timers to pull from local Nexus"
  ansible.builtin.systemd:
    name: "{{ item }}"
    masked: false
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - unattended-upgrades.service
  tags: ["strictly-local"]


# --------------------------------------------------------------------------
# Task 12: Offline Management Utilities (Logrotate & Update Scripts)
# --------------------------------------------------------------------------
- name: "GDC-TASK-12 | Configure regular gcloud components update cron job"
  ansible.builtin.cron:
    name: "Update Google Cloud SDK components regularly"
    job: "/usr/local/bin/gcloud components update -q > /dev/null 2>&1"
    special_time: "weekly"
    state: present
  tags: ["machine:connected"]

- name: "GDC-TASK-12 | Deploy skeleton service update scripts"
  ansible.builtin.copy:
    dest: "{{ gdc_install_root }}/scripts/{{ item.name }}"
    owner: "{{ gdc_admin_user }}"
    group: "{{ gdc_admin_group }}"
    mode: '0755'
    content: |
      #!/usr/bin/env bash
      # Generated by GDC Post-Install Provisioner
      # Skeleton script to update service: {{ item.service }}
      # TODO: Implement dynamic signature checking, file integrity checksum,
      # and secure service bounce controls.
      echo "Updating {{ item.service }}..."
      exit 0
  loop: "{{ gdc_service_update_scripts }}"
  tags: ["strictly-local"]

- name: "GDC-TASK-12 | Ensure verify-upgrade-readiness.sh is present in scripts workspace"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ gdc_install_root }}/scripts/verify-upgrade-readiness.sh"
    owner: root
    group: root
    mode: '0755'
  loop:
    - "/cdrom/custom-data/verify-upgrade-readiness.sh"
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-12 | Create global symlink for verify-upgrade-readiness.sh"
  ansible.builtin.file:
    src: "{{ gdc_install_root }}/scripts/verify-upgrade-readiness.sh"
    dest: "/usr/local/bin/verify-upgrade-readiness.sh"
    owner: root
    group: root
    mode: '0755'
    state: link
    force: yes
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-12 | Create hourly logrotate executable symlink"
  ansible.builtin.file:
    src: /etc/cron.daily/logrotate
    dest: /etc/cron.hourly/logrotate
    owner: root
    group: root
    mode: '0755'
    state: link
    force: yes
  tags: ["strictly-local"]

# --------------------------------------------------------------------------
# Configure Persistent GPG Signed-Commits for Ansible-Pull
# --------------------------------------------------------------------------
- name: "GDC-PROVISION-105 | Create systemd environment file for gdc-provisioner"
  ansible.builtin.copy:
    dest: /etc/default/gdc-provision
    owner: root
    group: root
    mode: '0644'
    content: |
      # gdc-provisioner execution environment configurations
      # Enforce signed commits toggle mapping
      ANSIBLE_PULL_FLAGS="{% if enforce_signed_commits %}--verify-commit{% else %}{% endif %}"

      # Diagnostics exclusions & obfuscation rules
      GDC_DIAGNOSTICS_EXCLUDE_PATTERNS="configs/ansible,configs/,/var/gdc-admin/keys/**"
      GDC_DIAGNOSTICS_OBFUSCATION_RULES="secrets.conf,**/password*"
  register: env_config_result

- name: "GDC-PROVISION-106 | Setup Local Gitea GPG Verification Keys"
  ansible.builtin.copy:
    src: /etc/ssl/certs/gdc-release.gpg
    dest: /etc/gpg/gdc-release.gpg
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  when: enforce_signed_commits
  ignore_errors: true

- name: "GDC-PROVISION-107 | Ensure legacy cron job is absent"
  ansible.builtin.cron:
    name: "Run GDC local config pull-sync (30 min cycles)"
    state: absent

- name: "GDC-PROVISION-107b | Ensure daily systemd timer is enabled and running"
  ansible.builtin.systemd:
    name: gdc-provision.timer
    enabled: true
    state: started

# --------------------------------------------------------------------------
# Preserved SSH & System Configurations
# --------------------------------------------------------------------------
- name: "GDC-PROVISION | Ensure SSH privilege separation directory exists"
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "GDC-PROVISION | Ensure GDC custom SSH configurations are deployed"
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/gdc.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Generated by GDC Provisioner Playbook
      # Disable reverse DNS lookup to prevent login hangs in offline or air-gapped subnets
      UseDNS no

- name: "GDC-PROVISION | Disable SSH socket activation to prevent port conflicts on Ubuntu 24.04"
  ansible.builtin.systemd:
    name: ssh.socket
    enabled: false
    state: stopped
  ignore_errors: true

- name: "GDC-PROVISION | Enable and start persistent SSH service daemon"
  ansible.builtin.systemd:
    name: ssh
    enabled: true
    state: restarted
  ignore_errors: true

# --------------------------------------------------------------------------
# Preserved Hardware Security (TPM 2.0 LUKS Sealing & Passcode Purging)
# --------------------------------------------------------------------------
- name: "GDC-TPM-SEAL | Verify physical or emulated TPM 2.0 availability"
  ansible.builtin.stat:
    path: /dev/tpmrm0
  register: tpm_device_stat

- name: "GDC-TPM-SEAL | Retrieve GDC LUKS system device partitions"
  ansible.builtin.shell: blkid -t TYPE=crypto_LUKS -o device
  register: luks_partition_devices
  changed_when: false
  failed_when: luks_partition_devices.stdout == ""
  when: tpm_device_stat.stat.exists

- name: "GDC-TPM-SEAL | Check if system is booted in UEFI mode"
  ansible.builtin.stat:
    path: /sys/firmware/efi
  register: efi_sys_stat

- name: "GDC-TPM-SEAL | Seal LUKS Master Key to TPM 2.0 PCR registers ({{ gdc_tpm_pcrs | default('0+7', true) }}) in UEFI mode"
  ansible.builtin.shell: |
    systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs={{ gdc_tpm_pcrs | default('0+7', true) }} --unlock-key-file=/etc/keys/temp_key.key {{ item }}
  environment:
    TCTI: "device:/dev/tpmrm0"
  loop: "{{ luks_partition_devices.stdout_lines }}"
  when:
    - tpm_device_stat.stat.exists
    - efi_sys_stat.stat.exists
  register: cryptenroll_uefi_result
  ignore_errors: true

- name: "GDC-TPM-SEAL | Seal LUKS Master Key to TPM 2.0 in Legacy BIOS mode"
  ansible.builtin.shell: |
    systemd-cryptenroll --tpm2-device=auto --tpm2-pcrs= --unlock-key-file=/etc/keys/temp_key.key {{ item }}
  environment:
    TCTI: "device:/dev/tpmrm0"
  loop: "{{ luks_partition_devices.stdout_lines }}"
  when:
    - tpm_device_stat.stat.exists
    - not efi_sys_stat.stat.exists
  register: cryptenroll_bios_result
  ignore_errors: true

- name: "GDC-TPM-SEAL | Reconfigure crypttab to use systemd-cryptenroll daemon"
  ansible.builtin.replace:
    path: /etc/crypttab
    regexp: '^(\S+)\s+(\S+)\s+/etc/keys/temp_key\.key\s+(\S+)'
    replace: '\1 \2 none \3,tpm2-device=auto,discard,noauto'
  register: crypttab_reconfigured
  when:
    - tpm_device_stat.stat.exists
    - (cryptenroll_uefi_result is succeeded and not cryptenroll_uefi_result.skipped | default(false)) or (cryptenroll_bios_result is succeeded and not cryptenroll_bios_result.skipped | default(false))

- name: "GDC-TPM-SEAL | Ensure CRYPTENROLL is enabled in cryptsetup-initramfs conf-hook"
  ansible.builtin.lineinfile:
    path: /etc/cryptsetup-initramfs/conf-hook
    regexp: '^#?CRYPTENROLL='
    line: 'CRYPTENROLL=y'
    create: yes
  register: cryptenroll_hook_configured
  when:
    - tpm_device_stat.stat.exists
    - (cryptenroll_uefi_result is succeeded and not cryptenroll_uefi_result.skipped | default(false)) or (cryptenroll_bios_result is succeeded and not cryptenroll_bios_result.skipped | default(false))

- name: "GDC-TPM-SEAL | Deploy persistent dracut config to omit deadlock drivers"
  ansible.builtin.copy:
    dest: /etc/dracut.conf.d/gdc.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Persistent GDC Dracut configuration
      # Surgically prune blacklisted AMD deadlock drivers from target OS initramfs
      # (ccp is omitted to prevent AMD PSP hardware deadlocks during early-boot LUKS unlocking)
      omit_drivers+=" pcie_mp2_amd amd_sfh ccp "
      
      # Forcefully pack logical volume, crypt, and tpm2-tss hooks (fixes NVMe-blind boot loops and guarantees TPM unseal across kernel upgrades)
      add_dracutmodules+=" crypt lvm tpm2-tss "
      add_drivers+=" tpm tpm_tis tpm_crb tpm_tis_core "
      hostonly="no"
  register: dracut_gdc_configured
  when: tpm_device_stat.stat.exists

- name: "GDC-TPM-SEAL | Purge conflicting or legacy initramfs-tools hooks on target OS"
  ansible.builtin.file:
    path: "/etc/initramfs-tools/hooks/{{ item }}"
    state: absent
  loop:
    - "gdc-tpm2"
    - "zz-gdc-blacklist"
  when: tpm_device_stat.stat.exists

- name: "GDC-TPM-SEAL | Rebuild initramfs using dracut to pack active TPM unlock hooks"
  ansible.builtin.shell: |
    TARGET_KERNEL=$(ls -t /lib/modules | head -n 1)
    dracut -f --no-hostonly --add "tpm2-tss" --add-drivers "tpm tpm_tis tpm_crb tpm_tis_core" "/boot/initrd.img-${TARGET_KERNEL}" "${TARGET_KERNEL}"
  register: dracut_rebuild_result
  when:
    - tpm_device_stat.stat.exists
    - (crypttab_reconfigured is defined and crypttab_reconfigured.changed) or (cryptenroll_hook_configured is defined and cryptenroll_hook_configured.changed) or (dracut_gdc_configured is defined and dracut_gdc_configured.changed)

- name: "GDC-TPM-SEAL | Purge insecure temporary passcode slot from LUKS keyslots"
  ansible.builtin.shell: |
    systemd-cryptenroll --wipe-slot=password --unlock-key-file=/etc/keys/temp_key.key {{ item }}
  environment:
    TCTI: "device:/dev/tpmrm0"
  loop: "{{ luks_partition_devices.stdout_lines }}"
  when:
    - tpm_device_stat.stat.exists
    - crypttab_reconfigured is defined and crypttab_reconfigured.changed

- name: "GDC-TPM-SEAL | Erase temporary plaintext key file from host filesystem"
  ansible.builtin.file:
    path: /etc/keys/temp_key.key
    state: absent
  when:
    - tpm_device_stat.stat.exists
    - crypttab_reconfigured is defined and crypttab_reconfigured.changed

# --------------------------------------------------------------------------
# Preserved Diagnostics & Console Logs
# --------------------------------------------------------------------------
- name: "GDC-PROVISION | Log SSH daemon status and routing tables to serial console for diagnostics"
  ansible.builtin.shell: |
    echo "=== DEBUG: SSH Daemon Status ===" > /dev/ttyS0
    systemctl status ssh >> /dev/ttyS0 || true
    echo "=== DEBUG: SSH Daemon Journal ===" > /dev/ttyS0
    journalctl -u ssh -n 50 >> /dev/ttyS0 || true
    echo "=== DEBUG: Active Listening Sockets ===" > /dev/ttyS0
    ss -ltunp >> /dev/ttyS0 || true
    echo "=== DEBUG: Listing of /etc/netplan ===" > /dev/ttyS0
    ls -la /etc/netplan/ >> /dev/ttyS0 || true
    echo "=== DEBUG: Netplan Configurations ===" > /dev/ttyS0
    cat /etc/netplan/* >> /dev/ttyS0 || true
    echo "=== DEBUG: Netplan Status ===" > /dev/ttyS0
    netplan status --all >> /dev/ttyS0 || true
    echo "=== DEBUG: Netplan Info ===" > /dev/ttyS0
    netplan info >> /dev/ttyS0 || true
    echo "=== DEBUG: Netplan Generate Output ===" > /dev/ttyS0
    netplan generate >> /dev/ttyS0 2>&1 || true
    echo "=== DEBUG: Generated Network Files ===" > /dev/ttyS0
    ls -la /run/systemd/network/ >> /dev/ttyS0 || true
    echo "=== DEBUG: Systemd-networkd Status ===" > /dev/ttyS0
    systemctl status systemd-networkd >> /dev/ttyS0 || true
    echo "=== DEBUG: Systemd-networkd Journal ===" > /dev/ttyS0
    journalctl -u systemd-networkd -n 50 >> /dev/ttyS0 || true
    echo "=== DEBUG: Routing Tables ===" > /dev/ttyS0
    ip route show table all >> /dev/ttyS0 || true
    echo "=== DEBUG: IP Addresses ===" > /dev/ttyS0
    ip addr show >> /dev/ttyS0 || true
  ignore_errors: true
  changed_when: false

- name: "GDC-PROVISION-108 | Signal Installation Completion Success"
  ansible.builtin.debug:
    msg: "SUCCESS: All Ready-Linux Post-Install provisioning tasks and security handshakes completed successfully."

- name: "GDC-PROVISION-109 | Write success token to serial console"
  ansible.builtin.shell: |
    timeout 3 sh -c 'echo "GDC_BOOTSTRAP_COMPLETE_SUCCESSFULLY" > /dev/ttyS0' || true
  changed_when: false
  ignore_errors: true
