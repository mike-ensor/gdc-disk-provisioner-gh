---
- name: "GDC-POST | Verify cluster nodes reach Ready condition"
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig=/etc/kubernetes/admin.conf wait --for=condition=Ready nodes --all --timeout=180s"
  register: nodes_ready_check
  changed_when: false
  failed_when: false

- name: "GDC-POST | Verify CoreDNS operational readiness"
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig=/etc/kubernetes/admin.conf rollout status deployment/coredns -n kube-system --timeout=120s"
  register: coredns_rollout_check
  changed_when: false
  failed_when: false

- name: "GDC-POST | Check storage classes availability"
  ansible.builtin.command:
    cmd: "kubectl --kubeconfig=/etc/kubernetes/admin.conf get sc"
  register: storage_class_check
  changed_when: false
  failed_when: false

- name: "GDC-POST | Execute ConfigSync and RootSync deployment"
  ansible.builtin.include_tasks: config_sync.yml

- name: "GDC-POST | Ingest and Handover Sub-CA PKI to In-Cluster cert-manager"
  ansible.builtin.include_tasks: cert_manager_pki.yml
  tags: ["corp-cert"]

- name: "GDC-POST | Sync cluster labels to Fleet Hub membership"
  ansible.builtin.command: >-
    gcloud container fleet memberships update {{ cluster_name }}
    --update-labels={{ cluster_config.fleet_cluster_labels | join(',') }}
    --project={{ gcp_project_id }}
  when:
    - gcp_project_id is defined and gcp_project_id | length > 0
    - cluster_config is defined and cluster_config.fleet_cluster_labels is defined
    - cluster_config.fleet_cluster_labels | length > 0
  changed_when: true
  failed_when: false

- name: "GDC-EVIDENCE | Structure PostCluster Evidence Facts"
  ansible.builtin.set_fact:
    post_cluster_evidence:
      kubernetes_nodes_ready: "{{ nodes_ready_check.rc == 0 }}"
      coredns_operational: "{{ coredns_rollout_check.rc == 0 }}"
      storage_classes_present: "{{ storage_class_check.rc == 0 }}"
      config_sync: "{{ config_sync_evidence | default({}) }}"
