---
# ==============================================================================
# Role Tasks: host_foundations
# ==============================================================================
# Tasks 03, 04, 05, and 06 of GDC-SPEC-READY-LINUX.
# ==============================================================================

# --------------------------------------------------------------------------
# Task 04: Administrator & Sudoers Provisioning
# --------------------------------------------------------------------------
- name: "GDC-TASK-04 | Check if installation fallback-config.json exists"
  ansible.builtin.stat:
    path: /etc/gdc/fallback-config.json
  register: install_config_stat
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Load installation fallback-config.json"
  ansible.builtin.slurp:
    src: /etc/gdc/fallback-config.json
  register: slurped_install_config
  when: install_config_stat.stat.exists
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Set debug mode fact"
  ansible.builtin.set_fact:
    host_foundations_debug_mode: "{{ (slurped_install_config.content | b64decode | from_json).gdc_debug_mode if (slurped_install_config is defined and slurped_install_config.content is defined and (slurped_install_config.content | b64decode | from_json).gdc_debug_mode is defined) else false }}"
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Check if provision.yml exists"
  ansible.builtin.stat:
    path: /etc/gdc/provision.yml
  register: provision_yml_stat
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Load provision.yml variables"
  ansible.builtin.include_vars:
    file: /etc/gdc/provision.yml
  when: provision_yml_stat.stat.exists
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Ensure administrative system group exists"
  ansible.builtin.group:
    name: "{{ gdc_admin_group }}"
    state: present
    system: true
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Ensure supplementary docker group exists"
  ansible.builtin.group:
    name: "docker"
    state: present
    system: true
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Ensure administrative system user exists"
  ansible.builtin.user:
    name: "{{ gdc_admin_user }}"
    uid: "{{ gdc_admin_uid | default(995) | int }}"
    group: "{{ gdc_admin_group }}"
    groups: "{{ gdc_admin_additional_groups }}"
    append: true
    shell: /bin/bash
    state: present
    system: true
    create_home: true
    home: "/home/{{ gdc_admin_user }}"
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Set up secure passwordless sudo for gdc-admin"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ gdc_admin_user }}"
    owner: root
    group: root
    mode: '0440'
    content: |
      {{ gdc_admin_user }} ALL=(ALL) NOPASSWD:ALL
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Grant passwordless sudo for temporary-installer (DEBUG MODE ONLY)"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/temporary-installer"
    owner: root
    group: root
    mode: '0440'
    content: |
      temporary-installer ALL=(ALL) NOPASSWD:ALL
  when: host_foundations_debug_mode | bool
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Revoke passwordless sudo for temporary-installer (PRODUCTION MODE)"
  ansible.builtin.file:
    path: "/etc/sudoers.d/temporary-installer"
    state: absent
  when: not (host_foundations_debug_mode | bool)
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Ensure standard sudo for debug_extra_user (DEBUG MODE ONLY)"
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ debug_extra_user }}"
    owner: root
    group: root
    mode: '0440'
    content: |
      {{ debug_extra_user }} ALL=(ALL) ALL
  when:
    - host_foundations_debug_mode | bool
    - debug_extra_user is defined
    - debug_extra_user | length > 0
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Revoke sudo for debug_extra_user (PRODUCTION MODE)"
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ debug_extra_user }}"
    state: absent
  when:
    - not (host_foundations_debug_mode | bool)
    - debug_extra_user is defined
    - debug_extra_user | length > 0
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Configure authorized SSH keys for gdc-admin"
  ansible.builtin.file:
    path: "/home/{{ gdc_admin_user }}/.ssh"
    state: directory
    owner: "{{ gdc_admin_user }}"
    group: "{{ gdc_admin_group }}"
    mode: '0700'
  tags: ["strictly-local"]

- name: "GDC-TASK-04 | Check if staged gdc-admin SSH keys exist"
  ansible.builtin.stat:
    path: /etc/gdc/admin-keys.pub
  register: admin_keys_stat
  tags: ["machine:connected", "machine:private-mode-normal", "strictly-local"]

- name: "GDC-TASK-04 | Apply staged SSH keys to gdc-admin"
  ansible.posix.authorized_key:
    user: "{{ gdc_admin_user }}"
    state: present
    key: "{{ lookup('file', '/etc/gdc/admin-keys.pub') }}"
  when: admin_keys_stat.stat.exists
  tags: ["machine:connected", "machine:private-mode-normal", "strictly-local"]

# --------------------------------------------------------------------------
# Task 03: Local Workspace Layout Provisioning
# --------------------------------------------------------------------------
- name: "GDC-TASK-03 | Ensure GDC installation root exists"
  ansible.builtin.file:
    path: "{{ gdc_install_root }}"
    state: directory
    owner: "{{ gdc_admin_user }}"
    group: "{{ gdc_admin_group }}"
    mode: '0755'
  tags: ["strictly-local"]

- name: "GDC-TASK-03 | Create GDC workspace directories recursively"
  ansible.builtin.file:
    path: "{{ gdc_install_root }}/{{ item }}"
    state: directory
    owner: "{{ gdc_admin_user }}"
    group: "{{ gdc_admin_group }}"
    mode: '0755'
  loop: "{{ gdc_install_directories }}"
  tags: ["strictly-local"]

- name: "GDC-TASK-03 | Ensure GDC categorized utility paths are configured in system profile"
  ansible.builtin.copy:
    dest: /etc/profile.d/gdc-paths.sh
    owner: root
    group: root
    mode: '0644'
    content: |
      # Add GDC categorized utility paths to PATH
      if [ -d "/usr/local/bin/auth" ] && [[ ":$PATH:" != *":/usr/local/bin/auth:"* ]]; then
        PATH="$PATH:/usr/local/bin/auth"
      fi
      if [ -d "/usr/local/bin/cluster" ] && [[ ":$PATH:" != *":/usr/local/bin/cluster:"* ]]; then
        PATH="$PATH:/usr/local/bin/cluster"
      fi
      export PATH
  tags: ["strictly-local"]

# --------------------------------------------------------------------------
# Task 05: Offline APT Repository Inception
# --------------------------------------------------------------------------
- name: "GDC-TASK-05 | Ensure GDC APT keyrings directory exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Register GDC Nexus trusted keyring from release certs"
  ansible.builtin.copy:
    src: /etc/ssl/certs/gdc-release.gpg
    dest: /etc/apt/keyrings/gdc-nexus.gpg
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Check if Nexus TLS certificate is active"
  ansible.builtin.stat:
    path: "{{ gdc_nexus_cert_path | default('/etc/ssl/certs/nexus.bundle.crt') }}"
  register: nexus_tls_cert_stat
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Write DEB822 local loopback Nexus sources"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/gdc-nexus.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      # Local GDC Hosted (Sideloaded Update) Repository
      Enabled: yes
      Types: deb
      URIs: {{ 'https://' + (gdc_nexus_domain | default('nexus.internal.gdc.local')) if (gdc_nexus_tls_enabled | default(true) | bool and (nexus_tls_cert_stat.stat.exists | default(false))) else 'http://127.0.0.1:8081' }}/repository/gdc-apt-hosted/
      Suites: noble
      Components: main
      Signed-By: /etc/apt/keyrings/gdc-nexus.gpg
      Trusted: yes

      # Local GDC Proxy (Upstream Cache) Repository
      Enabled: yes
      Types: deb
      URIs: {{ 'https://' + (gdc_nexus_domain | default('nexus.internal.gdc.local')) if (gdc_nexus_tls_enabled | default(true) | bool and (nexus_tls_cert_stat.stat.exists | default(false))) else 'http://127.0.0.1:8081' }}/repository/gdc-apt-proxy/
      Suites: noble noble-updates noble-backports noble-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
      Trusted: yes
  when: deactivate_public_sources | default(true) | bool
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Ensure local Nexus anonymous access and EULA acceptance"
  ansible.builtin.shell: |
    if curl -s -I --connect-timeout 2 http://127.0.0.1:8081/service/rest/v1/status | grep -q "200 OK"; then
      admin_pass="{{ nexus_admin_password | default('troubled-marble-150') }}"
      eula_json=$(curl -s -u admin:"${admin_pass}" http://127.0.0.1:8081/service/rest/v1/system/eula 2>/dev/null || true)
      if echo "${eula_json}" | grep -q '"accepted" : false'; then
        payload=$(echo "${eula_json}" | jq '.accepted = true')
        curl -s -f -u admin:"${admin_pass}" -X POST http://127.0.0.1:8081/service/rest/v1/system/eula -H "Content-Type: application/json" -d "${payload}" || true
      fi
      anon_json=$(curl -s -u admin:"${admin_pass}" http://127.0.0.1:8081/service/rest/v1/security/anonymous 2>/dev/null || true)
      if echo "${anon_json}" | grep -q '"enabled" : false'; then
        curl -s -f -u admin:"${admin_pass}" -X PUT http://127.0.0.1:8081/service/rest/v1/security/anonymous -H "Content-Type: application/json" -d '{"enabled": true, "userId": "anonymous", "realmName": "NexusAuthorizingRealm"}' || true
      fi
    fi
  changed_when: false
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Enforce Hosted APT Priority Pinning"
  ansible.builtin.copy:
    dest: /etc/apt/preferences.d/gdc-nexus-pin
    owner: root
    group: root
    mode: '0644'
    content: |
      Package: *
      Pin: release o=gdc-apt-hosted
      Pin-Priority: 1001
  when: deactivate_public_sources | default(true) | bool
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Check for active public Ubuntu sources"
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/ubuntu.sources
  register: public_sources_stat
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Deactivate public Ubuntu DEB822 sources"
  ansible.builtin.command: mv /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list.d/ubuntu.sources.bak
  when:
    - public_sources_stat.stat.exists
    - deactivate_public_sources | default(true) | bool
  changed_when: true
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Check for standard sources.list"
  ansible.builtin.stat:
    path: /etc/apt/sources.list
  register: standard_sources_stat
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Deactivate standard sources.list"
  ansible.builtin.command: mv /etc/apt/sources.list /etc/apt/sources.list.bak
  when:
    - standard_sources_stat.stat.exists
    - deactivate_public_sources | default(true) | bool
  changed_when: true
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Restore public Ubuntu DEB822 sources for connected testing"
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/ubuntu.sources
    owner: root
    group: root
    mode: '0644'
    content: |
      Types: deb
      URIs: {{ upstream_apt_mirror }}
      Suites: noble noble-updates noble-backports
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

      Types: deb
      URIs: {{ upstream_security_mirror }}
      Suites: noble-security
      Components: main restricted universe multiverse
      Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
  when: not (deactivate_public_sources | default(true) | bool)
  tags: ["strictly-local"]

- name: "GDC-TASK-05 | Restore standard sources.list for connected testing"
  ansible.builtin.command: mv /etc/apt/sources.list.bak /etc/apt/sources.list
  args:
    removes: /etc/apt/sources.list.bak
  when: not (deactivate_public_sources | default(true) | bool)
  changed_when: true
  ignore_errors: true
  tags: ["strictly-local"]

# --------------------------------------------------------------------------
# Task 06: Package Upgrade & Dependency Installation
# --------------------------------------------------------------------------
- name: "GDC-TASK-06 | Update APT package cache"
  ansible.builtin.apt:
    update_cache: true
  ignore_errors: true
  environment:
    NEEDRESTART_MODE: l
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-06 | Repair broken package dependencies"
  ansible.builtin.command: apt-get --fix-broken install -y
  changed_when: true
  ignore_errors: true
  environment:
    NEEDRESTART_MODE: l
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-06 | Validate package manager integrity before proceeding"
  ansible.builtin.command: apt-get check
  changed_when: false
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-06 | Perform Complete Offline System Package Upgrade"
  ansible.builtin.apt:
    upgrade: safe
    update_cache: false
  register: apt_upgrade_result
  ignore_errors: true
  when: trigger_system_upgrade | default(false)
  environment:
    NEEDRESTART_MODE: l
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-LOG-CON | Log packages wait to serial console"
  ansible.builtin.shell: |
    timeout 3 sh -c 'echo "--- GDC SYSTEM PACKAGES INSTALLATION STARTED ---" > /dev/ttyS0' || true
  changed_when: false
  ignore_errors: true

- name: "GDC-TASK-06 | Add upstream Docker GPG key for connected testing"
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
  when: not (deactivate_public_sources | default(true) | bool)
  tags: ["machine:connected", "external-dependency"]

- name: "GDC-TASK-06 | Add upstream Docker repository for connected testing"
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable"
    state: present
    update_cache: false
  when: not (deactivate_public_sources | default(true) | bool)
  tags: ["machine:connected", "external-dependency"]

- name: "GDC-TASK-06 | Add upstream Smallstep GPG key for connected testing"
  ansible.builtin.get_url:
    url: https://packages.smallstep.com/keys/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/smallstep.asc
    mode: '0644'
  when: not (deactivate_public_sources | default(true) | bool)
  tags: ["machine:connected", "external-dependency"]

- name: "GDC-TASK-06 | Add upstream Smallstep repository for connected testing"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/smallstep.asc] https://packages.smallstep.com/stable/debian debs main"
    state: present
    update_cache: false
  when: not (deactivate_public_sources | default(true) | bool)
  tags: ["machine:connected", "external-dependency"]

- name: "GDC-TASK-06 | Update APT package cache after adding repositories"
  ansible.builtin.apt:
    update_cache: true
  ignore_errors: true
  when: not (deactivate_public_sources | default(true) | bool)
  tags: ["machine:connected", "external-dependency"]

- name: "GDC-TASK-06 | Redefine core packages list for Ubuntu 24.04 (noble)"
  ansible.builtin.set_fact:
    gdc_core_packages: "{{ (gdc_core_packages | default([])) | reject('equalto', 'systemd-initramfs') | list }}"
  when: ansible_distribution_release == 'noble'
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-06 | Install GDC Configured Post-Install Packages"
  ansible.builtin.apt:
    name: "{{ gdc_core_packages | default([]) }}"
    state: present
    update_cache: false
    allow_downgrades: true
  register: apt_install_result
  environment:
    NEEDRESTART_MODE: l
  when: (gdc_core_packages | default([]) | length) > 0
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-06 | Purge unneeded or conflicting packages for security and stability"
  ansible.builtin.apt:
    name: "{{ gdc_purge_packages }}"
    state: absent
    purge: true
  ignore_errors: true
  environment:
    NEEDRESTART_MODE: l
  tags: ["strictly-local"]
