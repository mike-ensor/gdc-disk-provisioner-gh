---
# ==============================================================================
# GDC Host Foundations Role - Default Variables
# ==============================================================================

gdc_core_packages:
  - "python3"
  - "apt-transport-https"
  - "ca-certificates"
  - "conntrack"
  - "curl"
  - "software-properties-common"
  - "gnupg2"
  - "socat"
  - "iproute2"
  - "ebtables"
  - "ethtool"
  - "logrotate"
  - "libseccomp-dev"
  - "chrony"
  - "docker-ce"
  - "docker-ce-cli"
  - "containerd.io"
  - "tpm2-tools"
  - "libtss2-tcti-device0t64"
  - "cryptsetup"
  - "cryptsetup-initramfs"
  - "dracut"
  - "dracut-core"
  - "step-cli"
  - "auditd"
  - "rsyslog"
  - "audispd-plugins"
  - "unattended-upgrades"
  - "net-tools"
  - "arp-scan"
  - "linux-generic-hwe-24.04"
  - "nfs-common"

gdc_purge_packages:
  - "snapd"
  - "lxd"
  - "x11-common"
  - "ubuntu-server"
  - "ubuntu-server-minimal"

gdc_admin_user: "gdc-admin"
gdc_admin_group: "gdc-admin"
gdc_admin_additional_groups:
  - "sudo"
  - "docker"

gdc_install_root: "/var/gdc-install"
gdc_install_directories:
  - "logs"
  - "packages"
  - "config-sync-configs"
  - "bmctl-workspace"
  - "external-secrets"
  - "keys"
  - "kubeconfig"
  - "scripts"
  - "sds-configs"
  - "snapshots"
  - "tools"
  - "tools/google-cloud-sdk"
  - "tools/node-agent"
  - "vmruntime-configs"

deactivate_public_sources: true
