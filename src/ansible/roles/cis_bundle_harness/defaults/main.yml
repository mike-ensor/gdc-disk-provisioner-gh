---
cis_bundle_tarball_path: "/var/gdc-install/iso-cache/security/cis-hardening-amd64.tar.gz"
cis_bundle_install_dir: "/opt/cis-hardening"
cis_bundle_state_file: "/var/gdc-install/state/cis-benchmark.json"
cis_bundle_report_dir: "/opt/cis-benchmark/reports"
cis_bundle_log_dir: "/var/gdc-install/logs/cis"
cis_bundle_timeout_seconds: 1800
cis_bundle_process_hardening: >-
  {{
    lookup('env', 'GDC_PROCESS_CIS_HARDENING') | default(
      (machine_config | default({})).get('process_cis_hardening',
        (machine_config | default({})).get('security', {}).get('process_cis_hardening',
          (ansible_local | default({})).get('gdc', {}).get('process_cis_hardening',
            (ansible_local | default({})).get('gdc', {}).get('security', {}).get('process_cis_hardening', false)
          )
        )
      ),
      true
    ) | bool
  }}
