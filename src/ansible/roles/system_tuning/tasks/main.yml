---
# ==============================================================================
# Role Tasks: system_tuning
# ==============================================================================
# Tasks 07, 08, 09, and 10 of GDC-SPEC-READY-LINUX.
# ==============================================================================

# --------------------------------------------------------------------------
# Task 07: Kernel Tuning (Sysctl, BPF JIT, Swap, & Kernel Modules)
# --------------------------------------------------------------------------
- name: "GDC-TASK-07 | Disable swap partition and swap file immediately"
  ansible.builtin.shell: |
    swapoff -a
  changed_when: false
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Remove swap file from fstab persistently"
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*swap.*)$'
    replace: '# \1'
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Deploy persistent kernel sysctl tuning parameters"
  ansible.builtin.template:
    src: 99-gdc.conf.j2
    dest: /etc/sysctl.d/99-gdc.conf
    owner: root
    group: root
    mode: '0644'
  register: sysctl_deploy
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Reload kernel parameters on configuration change"
  ansible.builtin.command: /sbin/sysctl -p /etc/sysctl.d/99-gdc.conf
  when: sysctl_deploy.changed
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Deploy persistent kernel module blacklist to prevent AMD fTPM conflicts"
  ansible.builtin.copy:
    dest: /etc/modprobe.d/gdc-blacklist.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Blacklist AMD Sensor Fusion Hub drivers to prevent firmware/TPM conflicts and system freezes on AMD platforms
      blacklist pcie_mp2_amd
      blacklist amd_sfh
  when: ansible_facts['processor_vendor'] is defined and ansible_facts['processor_vendor'] in ['AuthenticAMD', 'AMD']
  register: blacklist_deploy
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Rebuild initramfs on blacklist change to ensure early-boot enforcement"
  ansible.builtin.shell: |
    TARGET_KERNEL=$(ls -t /lib/modules | head -n 1)
    dracut -f --no-hostonly "/boot/initrd.img-${TARGET_KERNEL}" "${TARGET_KERNEL}"
  when: blacklist_deploy.changed
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Deploy persistent networking kernel modules for Kubernetes (nf_tables, br_netfilter)"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/gdc-networking.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Required by Google Distributed Cloud Node Requirements
      nf_tables
      br_netfilter
      # Preloaded to prevent 'Invalid ELF header magic' loops during containerd/kubelet initialization on Ubuntu 24.04
      iptable_filter
      ip6table_filter
  register: kmod_deploy
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Load networking kernel modules immediately"
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - nf_tables
    - br_netfilter
    - iptable_filter
    - ip6table_filter
  when: kmod_deploy.changed
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Deploy persistent storage kernel modules for Kubernetes (iscsi_tcp, ib_iser)"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/gdc-storage.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      # Preloaded on host to prevent 'Invalid ELF header magic' loops in bmctl bootstrap/kind container
      # when container's kmod lacks zstd decompression support for compressed host kernel modules
      iscsi_tcp
      ib_iser
  register: storage_kmod_deploy
  tags: ["strictly-local"]

- name: "GDC-TASK-07 | Load storage kernel modules immediately"
  ansible.builtin.command: modprobe {{ item }}
  loop:
    - iscsi_tcp
    - ib_iser
  when: storage_kmod_deploy.changed
  tags: ["strictly-local"]

# --------------------------------------------------------------------------
# Task 08: NTP Alignment & Timezone
# --------------------------------------------------------------------------
- name: "GDC-TASK-08 | Mask systemd-timesyncd daemon to avoid collision"
  ansible.builtin.systemd:
    name: systemd-timesyncd
    enabled: false
    masked: true
    state: stopped
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-08 | Enforce UTC system timezone"
  ansible.builtin.file:
    src: "/usr/share/zoneinfo/{{ gdc_system_timezone }}"
    dest: /etc/localtime
    state: link
    force: yes
  tags: ["strictly-local"]

- name: "GDC-TASK-08 | Deploy GDC optimized chrony.conf template"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
    owner: root
    group: root
    mode: '0644'
  register: chrony_config
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-08 | Restart Chrony NTP service"
  ansible.builtin.systemd:
    name: chrony
    state: restarted
    enabled: true
  when: chrony_config.changed
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-08 | Force Chrony step (Makestep)"
  ansible.builtin.command: chronyc -a makestep
  ignore_errors: true
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-08 | Trigger Chrony burst to immediately sample sources"
  ansible.builtin.command: chronyc "burst 4/4"
  ignore_errors: true
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-08 | Wait for Chrony to synchronize"
  ansible.builtin.command: chronyc waitsync 30
  ignore_errors: true
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-08 | Verify OS clock is synchronized"
  ansible.builtin.shell: timedatectl status | grep -q "System clock synchronized.*yes"
  register: timedatectl_check
  retries: 10
  delay: 2
  until: timedatectl_check.rc == 0
  ignore_errors: true
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

# --------------------------------------------------------------------------
# Task 09: Container Engines Setup & Loopback Redirects
# --------------------------------------------------------------------------
- name: "GDC-TASK-09 | Ensure Docker configuration directory exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["strictly-local"]

- name: "GDC-TASK-09 | Deploy Docker daemon local mirror configuration"
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "registry-mirrors": [
          "{{ gdc_docker_registry_mirror }}"
        ],
        "exec-opts": [
          "native.cgroupdriver=systemd"
        ]
      }
  register: docker_config
  tags: ["strictly-local"]

- name: "GDC-TASK-09 | Restart Docker daemon service"
  ansible.builtin.systemd:
    name: docker
    state: restarted
    enabled: true
  when: docker_config.changed
  ignore_errors: true
  tags: ["strictly-local"]

- name: "GDC-TASK-09 | Ensure containerd configuration directory exists"
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["strictly-local"]

- name: "GDC-TASK-09 | Deploy containerd local mirror configuration"
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    owner: root
    group: root
    mode: '0644'
    content: |
      version = 2
      [plugins]
        [plugins."io.containerd.grpc.v1.cri"]
          sandbox_image = "nexus.gdc.local:5001/pause:3.9"
          [plugins."io.containerd.grpc.v1.cri".containerd]
            default_runtime_name = "runc"
            [plugins."io.containerd.grpc.v1.cri".containerd.runtimes]
              [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc]
                runtime_type = "io.containerd.runc.v2"
                [plugins."io.containerd.grpc.v1.cri".containerd.runtimes.runc.options]
                  SystemdCgroup = true
          [plugins."io.containerd.grpc.v1.cri".registry]
            config_path = "/etc/containerd/certs.d"
  register: containerd_config
  tags: ["strictly-local"]

- name: "GDC-TASK-09 | Ensure containerd certificates directory structure exists"
  ansible.builtin.file:
    path: /etc/containerd/certs.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["strictly-local"]

- name: "GDC-TASK-09 | Restart containerd engine service"
  ansible.builtin.systemd:
    name: containerd
    state: restarted
    enabled: true
  when: containerd_config.changed
  ignore_errors: true
  tags: ["strictly-local"]

# --------------------------------------------------------------------------
# Task 10: Standalone Google Cloud SDK Inception
# --------------------------------------------------------------------------
- name: "GDC-TASK-10 | Ensure gcloud SDK installation directory parent exists"
  ansible.builtin.file:
    path: "/var/gdc-install/tools"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Check if gcloud SDK tarball archive is present"
  ansible.builtin.stat:
    path: "{{ gdc_gcloud_tarball_path }}"
  register: gcloud_tarball_stat
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Check if gcloud SDK tarball is present in /tmp"
  ansible.builtin.stat:
    path: "/tmp/google-cloud-cli-linux-x86_64.tar.gz"
  register: gcloud_tmp_tarball_stat
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Download Google Cloud SDK tarball for connected testing"
  ansible.builtin.get_url:
    url: "https://dl.google.com/dl/cloudsdk/channels/rapid/downloads/google-cloud-cli-linux-x86_64.tar.gz"
    dest: "/tmp/google-cloud-cli-linux-x86_64.tar.gz"
    mode: '0644'
  when:
    - not gcloud_tarball_stat.stat.exists
    - not gcloud_tmp_tarball_stat.stat.exists
    - not (deactivate_public_sources | default(true) | bool)
  register: gcloud_download_run
  tags: ["machine:connected", "external-dependency"]

- name: "GDC-TASK-10 | Set fact for gcloud tarball source path and availability"
  ansible.builtin.set_fact:
    gcloud_source_path: "{{ '/tmp/google-cloud-cli-linux-x86_64.tar.gz' if gcloud_tmp_tarball_stat.stat.exists else gdc_gcloud_tarball_path }}"
    gcloud_available: "{{ gcloud_tarball_stat.stat.exists or gcloud_tmp_tarball_stat.stat.exists or (gcloud_download_run is defined and gcloud_download_run is succeeded and not gcloud_download_run.skipped | default(false)) }}"
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Extract Standalone Google Cloud SDK archive"
  ansible.builtin.unarchive:
    src: "{{ gcloud_source_path }}"
    dest: "/var/gdc-install/tools/"
    remote_src: true
    creates: "{{ gdc_gcloud_install_dir }}/bin/gcloud"
  when: gcloud_available | bool
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Run gcloud quiet installation script"
  ansible.builtin.command:
    cmd: "{{ gdc_gcloud_install_dir }}/install.sh --quiet --usage-reporting=false --path-update=false"
    creates: "{{ gdc_gcloud_install_dir }}/bin/gcloud-installed-token"
  when: gcloud_available | bool
  register: gcloud_install_run
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Create gcloud installation sentinel"
  ansible.builtin.file:
    path: "{{ gdc_gcloud_install_dir }}/bin/gcloud-installed-token"
    state: touch
    owner: root
    group: root
    mode: '0644'
  when: gcloud_install_run is succeeded and not gcloud_install_run.skipped | default(false)
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Install Google Cloud SDK Components"
  ansible.builtin.command:
    cmd: "{{ gdc_gcloud_install_dir }}/bin/gcloud components install {{ item.app }} --quiet"
  loop: "{{ gdc_gcloud_components }}"
  when:
    - gcloud_available | bool
    - not ansible_check_mode
  ignore_errors: true
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Ensure gcloud SDK directory is owned by gdc-admin"
  ansible.builtin.file:
    path: "{{ gdc_gcloud_install_dir }}"
    state: directory
    owner: "{{ gdc_admin_user }}"
    group: "{{ gdc_admin_group }}"
    recurse: true
  when: gcloud_available | bool
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Create global symlinks for gcloud command utilities"
  ansible.builtin.file:
    src: "{{ gdc_gcloud_install_dir }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
    state: link
    force: yes
  loop:
    - "gcloud"
    - "gsutil"
    - "bq"
  when: gcloud_available | bool
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10 | Create global symlinks for GDC-specific SDK components"
  ansible.builtin.file:
    src: "{{ gdc_gcloud_install_dir }}/bin/{{ item.app }}"
    dest: "/usr/local/bin/{{ item.app }}"
    owner: root
    group: root
    mode: '0755'
    state: link
    force: yes
  loop: "{{ gdc_gcloud_components }}"
  when:
    - gcloud_available | bool
    - item.symlink | default(true) | bool
  tags: ["machine:connected", "machine:private-mode-normal", "external-dependency"]

- name: "GDC-TASK-10B | Ensure bmctl install directory exists"
  ansible.builtin.file:
    path: "/var/gdc-install/tools/bmctl"
    state: directory
    owner: gdc-admin
    group: gdc-admin
    mode: '0755'

- name: "GDC-TASK-10B | Copy bmctl binary from ISO cache"
  ansible.builtin.copy:
    src: "/var/gdc-install/iso-cache/tools/bmctl/bmctl"
    dest: "/var/gdc-install/tools/bmctl/bmctl"
    owner: gdc-admin
    group: gdc-admin
    mode: '0755'
    remote_src: yes
  ignore_errors: true

- name: "GDC-TASK-10B | Create symlink for bmctl in /usr/local/bin"
  ansible.builtin.file:
    src: "/var/gdc-install/tools/bmctl/bmctl"
    dest: "/usr/local/bin/bmctl"
    state: link
    owner: root
    group: root
