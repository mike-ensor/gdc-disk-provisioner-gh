---
- name: "GDC-PKI | Ingest Enterprise Sub-CA from Secret Manager"
  when:
    - cluster_config is defined
    - cluster_config.sub_ca_secret is defined
    - cluster_config.sub_ca_secret['gsm-name'] is defined
    - cluster_config.sub_ca_secret['gsm-name'] | trim | length > 0
  block:
    - name: "GDC-PKI | Access Sub-CA Secret payload via gcloud"
      ansible.builtin.command: >-
        gcloud secrets versions access latest
        --secret={{ cluster_config.sub_ca_secret['gsm-name'] }}
        {% if gcp_project_id is defined and gcp_project_id | trim | length > 0 %}--project={{ gcp_project_id }}{% endif %}
        {% if cluster_config.sub_ca_secret['gsm-location'] is defined and cluster_config.sub_ca_secret['gsm-location'] | trim | length > 0 and cluster_config.sub_ca_secret['gsm-location'] != 'global' %}
        --location={{ cluster_config.sub_ca_secret['gsm-location'] }}
        {% endif %}
      register: gsm_sub_ca_res
      changed_when: false
      failed_when: false
      no_log: true

    - name: "GDC-PKI | Fallback: Access Sub-CA Secret payload as global resource"
      ansible.builtin.command: >-
        gcloud secrets versions access latest
        --secret={{ cluster_config.sub_ca_secret['gsm-name'] }}
        {% if gcp_project_id is defined and gcp_project_id | trim | length > 0 %}--project={{ gcp_project_id }}{% endif %}
      register: gsm_sub_ca_res_fallback
      when:
        - gsm_sub_ca_res.rc != 0
        - cluster_config.sub_ca_secret['gsm-location'] is defined
        - cluster_config.sub_ca_secret['gsm-location'] != 'global'
      changed_when: false
      failed_when: false
      no_log: true

    - name: "GDC-PKI | Adopt fallback Sub-CA payload if successful"
      ansible.builtin.set_fact:
        gsm_sub_ca_res: "{{ gsm_sub_ca_res_fallback }}"
      when:
        - gsm_sub_ca_res.rc != 0
        - gsm_sub_ca_res_fallback is defined
        - gsm_sub_ca_res_fallback.rc is defined and gsm_sub_ca_res_fallback.rc == 0
      no_log: true

    - name: "GDC-PKI | Fail if Sub-CA secret retrieval failed"
      ansible.builtin.fail:
        msg: "Failed to retrieve Sub-CA secret '{{ cluster_config.sub_ca_secret['gsm-name'] }}' from Secret Manager."
      when: gsm_sub_ca_res.rc != 0

    - name: "GDC-PKI | Write Sub-CA credentials and register Root CA trust"
      when: gsm_sub_ca_res.rc == 0
      block:
        - name: "GDC-PKI | Ensure Sub-CA and private key directories exist"
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0700'
          loop:
            - "{{ gdc_sub_ca_dir }}"
            - "/etc/ssl/private"

        - name: "GDC-PKI | Write Corporate Root CA to system trust store"
          ansible.builtin.copy:
            dest: "{{ gdc_enterprise_root_cert_path }}"
            content: "{{ (gsm_sub_ca_res.stdout | from_json)['root.crt'] }}"
            owner: root
            group: root
            mode: '0644'
          register: root_ca_write_res

        - name: "GDC-PKI | Update OS System CA Certificates"
          ansible.builtin.command: update-ca-certificates
          when: root_ca_write_res.changed

        - name: "GDC-PKI | Write Sub-CA Certificate"
          ansible.builtin.copy:
            dest: "{{ gdc_sub_ca_cert_path }}"
            content: "{{ (gsm_sub_ca_res.stdout | from_json)['sub-ca.crt'] | default((gsm_sub_ca_res.stdout | from_json)['ca.crt'] | default('')) }}"
            owner: root
            group: root
            mode: '0644'

        - name: "GDC-PKI | Write Sub-CA Private Key"
          ansible.builtin.copy:
            dest: "{{ gdc_sub_ca_key_path }}"
            content: "{{ (gsm_sub_ca_res.stdout | from_json)['sub-ca.key'] | default((gsm_sub_ca_res.stdout | from_json)['ca.key'] | default('')) }}"
            owner: root
            group: root
            mode: '0400'
          no_log: true

        - name: "GDC-PKI | Mint initial Nexus TLS leaf certificate using Sub-CA"
          ansible.builtin.command: /usr/local/bin/refresh-nexus-tls.sh
          register: refresh_nexus_res
          changed_when: "'Minting initial certificate' in refresh_nexus_res.stdout or 'Successfully renewed' in refresh_nexus_res.stdout"

        - name: "GDC-PKI | Check if Nexus TLS certificate exists"
          ansible.builtin.stat:
            path: "{{ gdc_nexus_cert_path | default('/etc/ssl/certs/nexus.bundle.crt') }}"
          register: nexus_cert_stat_pki

        - name: "GDC-PKI | Enable nexus-tls.conf site in sites-enabled"
          ansible.builtin.file:
            src: /etc/nginx/sites-available/nexus-tls.conf
            dest: /etc/nginx/sites-enabled/nexus-tls.conf
            state: link
            owner: root
            group: root
          when: nexus_cert_stat_pki.stat.exists

        - name: "GDC-PKI | Remove /etc/nginx/sites-enabled/default if present"
          ansible.builtin.file:
            path: /etc/nginx/sites-enabled/default
            state: absent
          when: nexus_cert_stat_pki.stat.exists

        - name: "GDC-PKI | Reload and ensure Nginx service is running on TLS port 443"
          ansible.builtin.systemd:
            name: nginx
            state: reloaded
          when: nexus_cert_stat_pki.stat.exists

        - name: "GDC-PKI | Upgrade DEB822 Nexus sources to HTTPS endpoint"
          ansible.builtin.copy:
            dest: /etc/apt/sources.list.d/gdc-nexus.sources
            owner: root
            group: root
            mode: '0644'
            content: |
              # Local GDC Hosted (Sideloaded Update) Repository
              Enabled: yes
              Types: deb
              URIs: https://{{ gdc_nexus_domain | default('nexus.internal.gdc.local') }}/repository/gdc-apt-hosted/
              Suites: noble
              Components: main
              Signed-By: /etc/apt/keyrings/gdc-nexus.gpg
              Trusted: yes

              # Local GDC Proxy (Upstream Cache) Repository
              Enabled: yes
              Types: deb
              URIs: https://{{ gdc_nexus_domain | default('nexus.internal.gdc.local') }}/repository/gdc-apt-proxy/
              Suites: noble noble-updates noble-backports noble-security
              Components: main restricted universe multiverse
              Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
              Trusted: yes
          when: nexus_cert_stat_pki.stat.exists
