---
# ==============================================================================
# Role Tasks: machine_orchestration
# ==============================================================================
# Dynamic machine configuration, peer mapping, and node-agent service gating.
# Coordinated with GDC-COMP-SPEC-003 and GDC-SPEC-010.
# ==============================================================================

- name: "GDC-ORCH | Set MAC address fact"
  ansible.builtin.set_fact:
    node_mac: "{{ ansible_facts[gdc_primary_interface]['macaddress'] | lower }}"

- name: "GDC-ORCH | Check if /var/gdc-install/state/gdc-fact-manual.json exists"
  ansible.builtin.stat:
    path: /var/gdc-install/state/gdc-fact-manual.json
  register: manual_fact_stat

- name: "GDC-ORCH | Read /var/gdc-install/state/gdc-fact-manual.json if present"
  ansible.builtin.slurp:
    src: /var/gdc-install/state/gdc-fact-manual.json
  register: slurped_manual_fact
  when: manual_fact_stat.stat.exists

- name: "GDC-ORCH | Check if local machine-info-mock.json exists"
  ansible.builtin.stat:
    path: /etc/gdc/machine-info-mock.json
  register: mock_file_stat

- name: "GDC-ORCH | Fetch machine-info configuration from GDC Companion"
  ansible.builtin.uri:
    url: "{{ gdc_companion_base_url }}v1/machine-info/{{ node_mac }}"
    method: GET
    headers:
      Authorization: "Bearer {{ gdc_companion_api_key }}"
    status_code: 200
    validate_certs: false
  register: api_response
  ignore_errors: true
  when: not manual_fact_stat.stat.exists and not mock_file_stat.stat.exists

- name: "GDC-ORCH | Read local machine-info-mock.json if present"
  ansible.builtin.slurp:
    src: /etc/gdc/machine-info-mock.json
  register: slurped_mock
  when: not manual_fact_stat.stat.exists and mock_file_stat.stat.exists

- name: "GDC-ORCH | Parse and register configuration facts"
  ansible.builtin.set_fact:
    machine_config: >-
      {{
        (slurped_manual_fact.content | b64decode | from_json | combine({'is_fallback': false}))
        if manual_fact_stat.stat.exists
        else (
          (slurped_mock.content | b64decode | from_json | combine({'is_fallback': false}))
          if mock_file_stat.stat.exists
          else (api_response.json.variables | default(api_response.json | default({})) | combine({'is_fallback': false}))
        )
      }}

- name: "GDC-ORCH | Check if fallback-config.json exists"
  ansible.builtin.stat:
    path: /etc/gdc/fallback-config.json
  register: fallback_config_stat

- name: "GDC-ORCH | Load fallback-config.json"
  ansible.builtin.slurp:
    src: /etc/gdc/fallback-config.json
  register: slurped_fallback_config
  when: fallback_config_stat.stat.exists

- name: "GDC-ORCH | Set fallback machine-info configuration if API failed and no mock exists"
  ansible.builtin.set_fact:
    machine_config: "{{ slurped_fallback_config.content | b64decode | from_json }}"
  when: machine_config is not defined or machine_config == {} or 'error' in machine_config or 'hostname' not in machine_config

- name: "GDC-ORCH | Apply Desired State Configuration Fallbacks"
  ansible.builtin.set_fact:
    # TODO: These values will be natively provided by the GDC Companion API /v1/machine-info endpoint in a future release.
    # Until the API payload schema is updated to include them natively, we hardcode default fallbacks here 
    # to support the new independent system-desired-state ansible pull pipeline.
    machine_config: >-
      {{
        machine_config | combine({
          'archetype': machine_config.archetype | default('single'),
          'region': machine_config.region | default('us-east1'),
          'site_id': machine_config.site_id | default('location-123456789')
        })
      }}
- name: "GDC-ORCH | Install Smallstep CLI (step-cli) from ISO cache"
  ansible.builtin.apt:
    deb: "/var/gdc-install/iso-cache/packages/step-cli_0.26.1_amd64.deb"
  ignore_errors: true

- name: "GDC-ORCH | Deploy TPM mTLS Provisioning Script"
  ansible.builtin.copy:
    src: provision-mtls-cert.sh
    dest: /usr/local/bin/provision-mtls-cert.sh
    owner: root
    group: root
    mode: '0700'

- name: "GDC-ORCH | Execute TPM mTLS Attestation (Zero-Touch Provisioning)"
  ansible.builtin.command: /usr/local/bin/provision-mtls-cert.sh
  environment:
    STEP_IDENTITY: "{{ machine_config.hostname | default(node_mac) }}"
    STEP_NODE_MAC: "{{ node_mac }}"
    STEP_CA_URL: "{{ gdc_step_ca_url }}"
    STEP_CA_FINGERPRINT: "{{ gdc_step_ca_fingerprint }}"
    STEP_PROVISIONER_NAME: "{{ gdc_step_provisioner_name }}"
    STEP_PROVISIONER_PASSWORD: "{{ gdc_step_provisioner_password }}"
    STEP_MOCK_MTLS: "{{ 'true' if (mock_file_stat.stat.exists or manual_fact_stat.stat.exists) else 'false' }}"

- name: "GDC-ORCH | Check if mTLS client certs exist"
  ansible.builtin.stat:
    path: "/var/gdc-install/keys/client.crt"
  register: client_cert_stat


- name: "GDC-ORCH | Write API Lookup Status for Diagnostics Collector"
  ansible.builtin.copy:
    dest: "/etc/gdc/api-lookup-status.json"
    content: |
      {
        "api_lookup_successful": {{ 'false' if machine_config.is_fallback | default(false) else 'true' }},
        "fallback_used": {{ 'true' if machine_config.is_fallback | default(false) else 'false' }},
        "timestamp": "{{ ansible_date_time.iso8601 }}"
      }
    mode: '0644'

- name: "GDC-ORCH | Set system hostname"
  ansible.builtin.hostname:
    name: "{{ machine_config.hostname }}"
  when: machine_config.hostname is defined

- name: "GDC-ORCH | Ensure peers list is registered in /etc/hosts"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "{{ item.ipv4 }} {{ item.hostname }}"
    state: present
  loop: "{{ machine_config.peers }}"
  when: machine_config.peers is defined

- name: "GDC-ORCH | Check GDC Companion API health"
  ansible.builtin.uri:
    url: "{{ gdc_companion_base_url }}v1/machine-credentials/gcp-token/{{ node_mac }}"
    method: GET
    headers:
      Authorization: "Bearer {{ gdc_companion_api_key }}"
    client_cert: "{{ '/var/gdc-install/keys/client.crt' if client_cert_stat.stat.exists else omit }}"
    client_key: "{{ '/var/gdc-install/keys/client.key' if client_cert_stat.stat.exists else omit }}"
    status_code: [200, 400, 401, 403, 404]
    validate_certs: false
    return_content: yes
  register: companion_token_response
  ignore_errors: true


- name: "GDC-ORCH | Deploy GDC STS Proxy script"
  ansible.builtin.copy:
    src: gdc-sts-proxy.py
    dest: /usr/local/bin/gdc-sts-proxy.py
    owner: root
    group: root
    mode: '0755'

- name: "GDC-ORCH | Deploy GDC STS Proxy service"
  ansible.builtin.copy:
    src: gdc-sts-proxy.service
    dest: /etc/systemd/system/gdc-sts-proxy.service
    owner: root
    group: root
    mode: '0644'

- name: "GDC-ORCH | Enable and start GDC STS Proxy"
  ansible.builtin.systemd:
    name: gdc-sts-proxy.service
    enabled: true
    state: started
    daemon_reload: true

- name: "GDC-ORCH | Deploy ADC Executable script"
  ansible.builtin.copy:
    src: gdc-adc-executable.sh
    dest: /usr/local/bin/gdc-adc-executable.sh
    owner: root
    group: root
    mode: '0755'

- name: "GDC-ORCH | Deploy GDC credentials refresh script"
  ansible.builtin.template:
    src: refresh-gdc-credentials.sh.j2
    dest: /usr/local/bin/refresh-gdc-credentials.sh
    owner: root
    group: root
    mode: '0755'

- name: "GDC-ORCH | Execute GDC credentials refresh script to seed initial token"
  ansible.builtin.command: /usr/local/bin/refresh-gdc-credentials.sh
  register: token_refresh_result
  failed_when: token_refresh_result.rc != 0


# ==============================================================================
# TEMPORARY WORKAROUND: ADC EXECUTABLE WRAPPER
# This external_account setup allows the GCP SDKs to read the raw access
# token refreshed by refresh-gdc-credentials.sh.
# See FUTURE SECURITY TASK in PROGRESS.md to replace this with native OIDC WIF.
# ==============================================================================
- name: "GDC-ORCH | Generate Application Default Credentials mapping"
  ansible.builtin.copy:
    dest: /etc/gdc/application_default_credentials.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "type": "external_account",
        "audience": "//iam.googleapis.com/projects/{{ machine_config.gcp_info.project_id }}/locations/global/workloadIdentityPools/local/providers/local",
        "subject_token_type": "urn:ietf:params:oauth:token-type:jwt",
        "token_url": "http://127.0.0.1:12345/token",
        "credential_source": {
          "executable": {
            "command": "/usr/local/bin/gdc-adc-executable.sh",
            "timeout_millis": 10000,
            "output_file": ""
          }
        }
      }

- name: "GDC-ORCH | Set global GOOGLE_APPLICATION_CREDENTIALS for ADC"
  ansible.builtin.copy:
    dest: /etc/profile.d/gdc-adc.sh
    owner: root
    group: root
    mode: '0644'
    content: |
      if [ ! -f /etc/gdc/manual_adc_override ]; then
        export GOOGLE_APPLICATION_CREDENTIALS="/etc/gdc/application_default_credentials.json"
        export GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES="1"
      fi
      
      alias gdc-adc-disable='unset GOOGLE_APPLICATION_CREDENTIALS GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES'
      alias gdc-adc-enable='export GOOGLE_APPLICATION_CREDENTIALS="/etc/gdc/application_default_credentials.json" GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES="1"'

- name: "GDC-ORCH | Set system-wide GOOGLE_APPLICATION_CREDENTIALS in /etc/environment"
  ansible.builtin.lineinfile:
    path: /etc/environment
    regexp: "^{{ item.key }}="
    line: '{{ item.key }}="{{ item.value }}"'
    state: present
    create: true
    owner: root
    group: root
    mode: '0600'
  loop:
    - { key: 'GOOGLE_APPLICATION_CREDENTIALS', value: '/etc/gdc/application_default_credentials.json' }
    - { key: 'GOOGLE_EXTERNAL_ACCOUNT_ALLOW_EXECUTABLES', value: '1' }

- name: "GDC-ORCH | Authenticate gcloud using short-lived access token"
  ansible.builtin.shell: |
    # Clean up the legacy incorrect property if it exists
    gcloud config unset auth/access_token 2>/dev/null || true
    sudo -u {{ gdc_admin_user }} gcloud config unset auth/access_token 2>/dev/null || true

    # Link gcloud to dynamically read the volatile access token file
    gcloud config set auth/access_token_file /run/gdc-auth/access_token
    gcloud config set account {{ machine_config.gcp_info.primary_gsa }}
    gcloud config set project {{ machine_config.gcp_info.project_id }}
    
    # Authenticate for gdc-admin (operator and cron jobs)
    sudo -u {{ gdc_admin_user }} gcloud config set auth/access_token_file /run/gdc-auth/access_token
    sudo -u {{ gdc_admin_user }} gcloud config set account {{ machine_config.gcp_info.primary_gsa }}
    sudo -u {{ gdc_admin_user }} gcloud config set project {{ machine_config.gcp_info.project_id }}
  no_log: true

- name: "GDC-ORCH | Schedule automatic GDC credential renewal (@reboot)"
  ansible.builtin.cron:
    name: "gdc-credentials-refresh-reboot"
    special_time: reboot
    user: root
    job: "/usr/local/bin/refresh-gdc-credentials.sh > /dev/null 2>&1"
    state: present

- name: "GDC-ORCH | Schedule automatic GDC credential renewal (every 15 mins)"
  ansible.builtin.cron:
    name: "gdc-credentials-refresh-15min"
    minute: "*/15"
    user: root
    job: "/usr/local/bin/refresh-gdc-credentials.sh > /dev/null 2>&1"
    state: present
    
- name: "GDC-ORCH | Purge legacy 30 min cron job"
  ansible.builtin.cron:
    name: "gdc-credentials-refresh-30min"
    state: absent

- name: "GDC-ORCH | Ensure NodeAgent install directory exists"
  ansible.builtin.file:
    path: "/var/gdc-install/tools/node-agent"
    state: directory
    owner: gdc-admin
    group: gdc-admin
    mode: '0755'

- name: "GDC-ORCH | Copy nodeagentd binary from ISO cache"
  ansible.builtin.copy:
    src: "/var/gdc-install/iso-cache/tools/node-agent/nodeagentd"
    dest: "/var/gdc-install/tools/node-agent/nodeagentd"
    owner: gdc-admin
    group: gdc-admin
    mode: '0755'
    remote_src: yes
  ignore_errors: true

- name: "GDC-ORCH | Create node-agent systemd service unit"
  ansible.builtin.template:
    src: node-agent.service.j2
    dest: /etc/systemd/system/node-agent.service
    owner: root
    group: root
    mode: '0644'
  register: nodeagent_service_unit

- name: "GDC-ORCH | Enable and start GDC NodeAgent service"
  ansible.builtin.systemd:
    name: node-agent.service
    enabled: false
    masked: true
    state: stopped
    daemon_reload: yes

- name: "GDC-ORCH | Ensure Ansible facts.d directory exists"
  ansible.builtin.file:
    path: /etc/ansible/facts.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: "GDC-ORCH | Persist machine_config to local facts for CLUSTER_TURNUP"
  ansible.builtin.copy:
    dest: /etc/ansible/facts.d/gdc.fact
    owner: root
    group: root
    mode: '0644'
    content: "{{ machine_config | to_nice_json }}"

- name: "GDC-ORCH | Deploy GDC Netplan configuration"
  ansible.builtin.template:
    src: 50-gdc-network.yaml.j2
    dest: /etc/netplan/99-gdc-cluster-network.yaml
    owner: root
    group: root
    mode: '0600'
  when:
    - machine_config.network is defined
    - not (machine_config.is_fallback | default(false))

- name: "GDC-ORCH | Remove bootstrap 01-netcfg.yaml to prevent Netplan address list merging"
  ansible.builtin.file:
    path: /etc/netplan/01-netcfg.yaml
    state: absent
  when:
    - machine_config.network is defined
    - not (machine_config.is_fallback | default(false))

- name: "GDC-ORCH | Apply Netplan configuration"
  ansible.builtin.command: netplan apply
  when:
    - machine_config.network is defined
    - not (machine_config.is_fallback | default(false))

- name: "GDC-ORCH | Ensure systemd-networkd instantiates new netdev interfaces"
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
  when:
    - machine_config.network is defined
    - not (machine_config.is_fallback | default(false))

- name: "GDC-NETWORK | Network Sanity Check (Ping Gateway with DHCP wait)"
  ansible.builtin.shell: |
    # 1. Check if the primary interface has an IP yet.
    if ! ip -4 addr show dev "{{ gdc_primary_interface }}" | grep -q "inet "; then
      echo "Waiting for DHCP lease on {{ gdc_primary_interface }}..."
      exit 1
    fi

    # 2. Extract the gateway specific to the primary interface.
    GW_IP=$(ip route show table all | grep "default.*dev {{ gdc_primary_interface }}" | awk '{print $3}' | head -n 1)
    if [ -z "$GW_IP" ]; then
      echo "Waiting for default route on {{ gdc_primary_interface }}..."
      exit 1
    fi

    # 3. We have an IP and a Gateway. Attempt the ping.
    ping -c 1 -W 2 -I "{{ gdc_primary_interface }}" "$GW_IP"
  register: gateway_ping
  changed_when: false
  ignore_errors: true
  until: gateway_ping.rc == 0
  retries: 15
  delay: 5

- name: "GDC-NETWORK | Halt if Network Sanity Check Fails"
  ansible.builtin.fail:
    msg: "Network Sanity Check failed. Cannot ping gateway for interface {{ gdc_primary_interface }}"
  when: gateway_ping.rc != 0

- name: "GDC-ORCH | Execute dynamic IP allocation network checks"
  ansible.builtin.command:
    cmd: "/usr/local/bin/scan_ips.py --interface {{ gdc_primary_interface }} --config /etc/ansible/facts.d/gdc.fact"
  changed_when: false
  ignore_errors: true

- name: "GDC-ORCH | Deploy cluster networking validation script"
  ansible.builtin.copy:
    src: validate-cluster-networking.sh
    dest: /usr/local/bin/validate-cluster-networking.sh
    owner: root
    group: root
    mode: '0755'

- name: "GDC-EVIDENCE | Stat mTLS Client Certificate"
  ansible.builtin.stat:
    path: /var/gdc-install/keys/client.crt
  register: cert_stat_ev

- name: "GDC-EVIDENCE | Stat mTLS Client Key"
  ansible.builtin.stat:
    path: /var/gdc-install/keys/client.key
  register: key_stat_ev

- name: "GDC-EVIDENCE | Extract Subject CN"
  ansible.builtin.shell: |
    openssl x509 -in /var/gdc-install/keys/client.crt -noout -subject | sed -n 's/.*CN = \([^,]*\).*/\1/p' | xargs
  register: subject_cn_output
  changed_when: false
  ignore_errors: true
  when: cert_stat_ev.stat.exists

- name: "GDC-EVIDENCE | Extract Issuer CN"
  ansible.builtin.shell: |
    openssl x509 -in /var/gdc-install/keys/client.crt -noout -issuer | sed -n 's/.*CN = \([^,]*\).*/\1/p' | xargs
  register: issuer_cn_output
  changed_when: false
  ignore_errors: true
  when: cert_stat_ev.stat.exists

- name: "GDC-EVIDENCE | Verify gcloud authentication state"
  ansible.builtin.shell: gcloud config configurations list | grep -q "True.*{{ machine_config.gcp_info.primary_gsa }}"
  register: gcloud_auth_check
  ignore_errors: true
  changed_when: false

- name: "GDC-EVIDENCE | Structure Evidence Facts"
  ansible.builtin.set_fact:
    cluster_ready_evidence:
      timing:
        start_time: "{{ cluster_ready_start_time | default(ansible_date_time.iso8601) }}"
        end_time: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
        duration_seconds: "{{ [(now(utc=true).strftime('%s') | int) - (cluster_ready_start_epoch | default(now(utc=true).strftime('%s')) | int), 0] | max }}"
        overall_provisioning_start_time: "{{ provisioning_start_time | default(cluster_ready_start_time | default(ansible_date_time.iso8601)) }}"
      network_sanity: "Network Sanity Check [{{ gdc_primary_interface }}] = {{ 'True' if gateway_ping.rc is defined and gateway_ping.rc == 0 else 'False' }}"
      mtls_checks:
        cert_exists: "{{ cert_stat_ev.stat.exists | bool }}"
        cert_permissions: "{{ cert_stat_ev.stat.mode | default('') }}"
        key_exists: "{{ key_stat_ev.stat.exists | bool }}"
        key_permissions: "{{ key_stat_ev.stat.mode | default('') }}"
        subject_cn: "{{ subject_cn_output.stdout | default('') }}"
        issuer_cn: "{{ issuer_cn_output.stdout | default('') }}"
      token_broker:
        companion_reachable: "{{ companion_token_response.status | default(0) | int > 0 }}"
        http_status: "{{ companion_token_response.status | default(0) | int }}"
        token_fetched: "{{ token_refresh_result.rc is defined and token_refresh_result.rc == 0 }}"
        token_type: "Bearer"
      gcloud_status:
        authenticated: "{{ gcloud_auth_check.rc == 0 }}"

- name: "GDC-ORCH | Verify peer hostname resolution"
  ansible.builtin.command:
    cmd: "getent hosts {{ item.hostname }}"
  loop: "{{ machine_config.peers }}"
  register: host_resolution
  failed_when: host_resolution.rc != 0
  changed_when: false
  when: machine_config.peers is defined

- name: "GDC-ORCH | Verify peer network pingability (Wait up to 5 mins)"
  ansible.builtin.command:
    cmd: "ping -c 1 {{ item.ipv4 }}"
  loop: "{{ machine_config.peers }}"
  register: peer_ping
  until: peer_ping.rc == 0
  retries: 10
  delay: 30
  failed_when: false
  changed_when: false
  when: machine_config.peers is defined

- name: "GDC-ORCH | Check if any peers are unreachable"
  ansible.builtin.set_fact:
    peers_unreachable: true
  loop: "{{ peer_ping.results }}"
  when: 
    - machine_config.peers is defined
    - item.rc is defined
    - item.rc != 0

- name: "GDC-ORCH | Gracefully halt if waiting on peers"
  ansible.builtin.fail:
    msg: "WAITING_ON_PEERS"
  when: peers_unreachable | default(false)

- name: "GDC-ORCH | Ensure /usr/local/bin/cluster directory exists"
  ansible.builtin.file:
    path: /usr/local/bin/cluster
    state: directory
    owner: root
    group: root
    mode: '0755'
  ignore_errors: true

- name: "GDC-ORCH | Ensure /usr/local/bin/cluster/create_cluster.sh is deployed"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/local/bin/cluster/create_cluster.sh"
    owner: root
    group: root
    mode: '0755'
    remote_src: yes
  loop:
    - "/var/gdc-install/iso-cache/cluster/create_cluster.sh"
    - "/var/gdc-install/iso-cache/bin/create_cluster.sh"
  ignore_errors: true

