# Generated dynamically by GDC storage orchestrator (BIOS Single Disk)
  config:
    - {type: disk, id: disk-system, path: /dev/${DISK_1}, ptable: gpt, grub_device: true, wipe: superblock}
    - {type: partition, id: partition-bios-grub, device: disk-system, size: 1048576, flag: bios_grub}
    - {type: partition, id: partition-boot, device: disk-system, size: 2147483648}
    - {type: partition, id: partition-lvm, device: disk-system, size: -1, wipe: superblock}
    - {type: format, id: format-boot, volume: partition-boot, fstype: ext4}
    - {type: mount, id: mount-boot, device: format-boot, path: /boot}
    - {type: dm_crypt, id: crypt-system, volume: partition-lvm, keyfile: /var/log/installer/gdc-luks-key}
    - {type: lvm_volgroup, id: vg-system, name: vg_system, devices: [crypt-system]}
    
    # Scaled Logical Volumes for Single Disk (Total requested: ~210 G out of 232 G actual)
    - {type: lvm_partition, id: lv-root, volgroup: vg-system, name: lv_root, size: 15G}
    - {type: lvm_partition, id: lv-var, volgroup: vg-system, name: lv_var, size: 25G}
    - {type: lvm_partition, id: lv-varlog, volgroup: vg-system, name: lv_var_log, size: 15G}
    - {type: lvm_partition, id: lv-metrics, volgroup: vg-system, name: lv_var_opt_metrics, size: 12G}
    - {type: lvm_partition, id: lv-containerd, volgroup: vg-system, name: lv_containerd, size: 33G}
    - {type: lvm_partition, id: lv-etcd, volgroup: vg-system, name: lv_etcd, size: 22G}
    - {type: lvm_partition, id: lv-etcd-events, volgroup: vg-system, name: lv_etcd_events, size: 7G}
    - {type: lvm_partition, id: lv-gitea, volgroup: vg-system, name: lv_gitea, size: 15G}
    - {type: lvm_partition, id: lv-nexus, volgroup: vg-system, name: lv_nexus, size: 50G}
    - {type: lvm_partition, id: lv-localdisk, volgroup: vg-system, name: lv_local_disk, size: 25G}
    - {type: lvm_partition, id: lv-sds, volgroup: vg-system, name: lv_sds, size: -1}
