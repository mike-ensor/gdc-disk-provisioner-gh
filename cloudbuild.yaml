# ==============================================================================
# GDC Bootloader - Google Cloud Build Pipeline Configuration
# ==============================================================================
# This pipeline builds, validates, and deploys the custom GDC bootstrap ISO
# completely in the cloud, mirroring the exact stage-gate make targets
# used during local developer workstation cycles.
# ==============================================================================

steps:
  # ==========================================
  # Step 1: Pull "Blessed" ISO from GCS
  # ==========================================
  # Pulls the official Ubuntu 24.04 ISO from your GCS bucket source folder 
  # directly into our local build cache workspace.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'pull-source-iso'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "[-] [CI Stage: deps] Creating local cache directory structure..."
        mkdir -p .cache/isos
        mkdir -p .cache/binaries
        
        # Determine source bucket for the blessed ISO
        if [ -n "${_ISO_BLESSED_GCS_BUCKET}" ]; then
          BLESSED_BUCKET=$(echo "${_ISO_BLESSED_GCS_BUCKET}" | sed 's/^gs:\/\///')
        else
          BLESSED_BUCKET=$(echo "${_GCS_BUCKET_NAME}" | sed 's/^gs:\/\///')
        fi
        
        echo "[-] Checking GCS for source ISO at gs://$${BLESSED_BUCKET}/source/${_SOURCE_ISO_FILENAME}..."
        if gcloud storage objects describe gs://$${BLESSED_BUCKET}/source/${_SOURCE_ISO_FILENAME} &>/dev/null; then
          echo "[-] Downloading blessed ISO from GCS bucket..."
          gcloud storage cp gs://$${BLESSED_BUCKET}/source/${_SOURCE_ISO_FILENAME} .cache/isos/${_SOURCE_ISO_FILENAME}
          echo "[-] Download complete."
        else
          echo "[!] Error: Source ISO not found at gs://$${BLESSED_BUCKET}/source/${_SOURCE_ISO_FILENAME}." >&2
          echo "[!] Please upload the blessed ISO to your bucket first to avoid heavy internet downloads." >&2
          exit 1
        fi

        echo "[-] Pulling cached GGD binaries from GCS binaries/ prefix..."
        for file in "gitea-1.22.1-linux-amd64" "OpenJDK17U-jre_x64_linux_hotspot_17.0.11_9.tar.gz" "nexus-3.69.0-02-unix.tar.gz" "google-cloud-cli-575.0.0-linux-x86_64.tar.gz" "step-cli_0.26.1_amd64.deb"; do
          gcs_path="gs://${_GCS_BUCKET_NAME}/binaries/$file"
          local_path=".cache/binaries/$file"
          if [ ! -f "$local_path" ]; then
            if gcloud storage objects describe "$gcs_path" &>/dev/null; then
              echo "  [x] Downloading $file from GCS cache..."
              gcloud storage cp "$gcs_path" "$local_path"
            else
              echo "  [!] $file not found in GCS. Fallback to public curl will apply in compile step."
            fi
          fi
        done

        echo "[-] Pulling cached GGD Debian packages from GCS packages/ prefix..."
        mkdir -p .cache/packages
        if gcloud storage ls "gs://${_GCS_BUCKET_NAME}/packages/*.deb" &>/dev/null; then
          gcloud storage cp "gs://${_GCS_BUCKET_NAME}/packages/*.deb" ".cache/packages/"
          echo "  [x] Successfully synchronized cached packages from GCS."
        else
          echo "  [!] No cached packages found in gs://${_GCS_BUCKET_NAME}/packages/."
        fi

  # ==========================================
  # Step 2: ISO Template, Validate, and Assemble Gates
  # ==========================================
  # Uses the custom builder container containing xorriso, rsync, shellcheck, and pylint.
  # Automatically triggers: check-env -> deps -> pull-customer-deps -> extract-customer-deps -> apply-customer-deps -> extract -> hydrate -> validate -> assemble -> test-static
  - name: '${_REGION}-docker.pkg.dev/${_PROJECT_ID}/gdc-build-images/iso-builder:${_BUILD_VERSION}'
    id: 'build-and-validate-iso'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        echo "[-] [CI Stage: compile] Triggering Stage-Gate compilation for version: ${_ISO_VERSION}..."
        
        # Build the targets sequentially using GNU Make dependencies
        make -C src/build test-static \
          ISO_VERSION="${_ISO_VERSION}" \
          SOURCE_ISO_FILENAME="${_SOURCE_ISO_FILENAME}" \
          GDC_DEBUG_MODE="${_GDC_DEBUG_MODE}" \
          ENABLE_GCS="true" \
          GCS_BUCKET="gs://${_GCS_BUCKET_NAME}" \
          _CUSTOMER_ASSETS_URI="${_CUSTOMER_ASSETS_URI}" \
          AUTO_APPROVE="true"

  # ==========================================
  # Step 3: Publish, Manifest, and Promote Release Artifacts
  # ==========================================
  # Uses gcloud to trigger release deployments, compile the JSON Provenance Manifest,
  # archive the debug templates tarball, and perform bucket cleanups.
  - name: 'gcr.io/cloud-builders/gcloud'
    id: 'publish-and-promote'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        BUILD_META="build-workspace/build_meta.env"
        if [ ! -f "$${BUILD_META}" ]; then
          echo "[!] Error: Compilation metadata file not found at $${BUILD_META}." >&2
          exit 1
        fi
        
        # Write git branch and commit to local file for report generator
        mkdir -p build-workspace
        echo "GIT_BRANCH=${_GIT_BRANCH}" > build-workspace/git_info.env
        echo "GIT_COMMIT=${_GIT_COMMIT}" >> build-workspace/git_info.env
        
        # Import variables from the compilation metadata
        source "$${BUILD_META}"
        echo "[-] Found compiled ISO: $${ISO_OUTPUT_NAME} at $${ISO_OUTPUT_PATH}"
        
        # Trigger deploy, publish, and reports gates via Make
        make -C src/build deploy publish reports \
          ISO_VERSION="${_ISO_VERSION}" \
          GDC_DEBUG_MODE="${_GDC_DEBUG_MODE}" \
          ENABLE_GCS="true" \
          GCS_BUCKET="gs://${_GCS_BUCKET_NAME}" \
          _CUSTOMER_ASSETS_URI="${_CUSTOMER_ASSETS_URI}"
        
        BUCKET_NAME=$(echo "${_GCS_BUCKET_NAME}" | sed 's/^gs:\/\///')
        
        echo "[-] Performing bucket retention cleanup (keeping last 5 ISOs in sync/)..."
        # List all ISOs in the sync/ directory of the bucket, sorted naturally by semantic version
        ISO_LIST=$(gcloud storage ls "gs://$${BUCKET_NAME}/sync/*.iso" 2>/dev/null | sort -V || true)
        
        if [ -n "$${ISO_LIST}" ]; then
          ISO_COUNT=$(echo "$${ISO_LIST}" | wc -l)
          echo "[-] Found $${ISO_COUNT} ISOs in the sync/ folder."
          
          if [ "$${ISO_COUNT}" -gt 5 ]; then
            ARCHIVE_COUNT=$((ISO_COUNT - 5))
            echo "[-] Archiving $${ARCHIVE_COUNT} older ISOs to the archived/ folder..."
            ARCHIVE_LIST=$(echo "$${ISO_LIST}" | head -n "$${ARCHIVE_COUNT}")
            
            while IFS= read -r iso_path; do
              if [ -n "$${iso_path}" ]; then
                filename=$$(basename "$${iso_path}")
                echo "[-] Archiving: $${filename} -> gs://$${BUCKET_NAME}/archived/$${filename}"
                gcloud storage mv "$${iso_path}" "gs://$${BUCKET_NAME}/archived/$${filename}"
              fi
            done <<< "$${ARCHIVE_LIST}"
            echo "[-] Retention cleanup complete."
          else
            echo "[-] ISO count ($${ISO_COUNT}) is <= 5. No archiving needed in sync/."
          fi
        fi

# Default substitutions for local development / manual runs
substitutions:
  _GCS_BUCKET_NAME: 'gdc-disk-provisioner-isos'
  _SOURCE_ISO_FILENAME: 'ubuntu-24.04-live-server-amd64.iso'
  _ISO_VERSION: '1.0.0'
  _BUILD_VERSION: '1.0.0'
  _REGION: 'us-central1'
  _PROJECT_ID: 'my-gcp-project-id'
  _ISO_BLESSED_GCS_BUCKET: ''
  _GDC_DEBUG_MODE: 'false'
  _CUSTOMER_ASSETS_URI: ''
  _GIT_BRANCH: 'N/A'
  _GIT_COMMIT: 'N/A'

# Extend timeout to 30 minutes in case of larger asset synchronization
timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY
